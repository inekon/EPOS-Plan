1="764" x2="112" y2="764" stroke="#c81e1e" stroke-width="3.5"/><text x="122" y="768" font-size="12" text-anchor="start" font-family="Arial, sans-serif" fill="#222222">Vorlauf / Warmwasser</text><line x1="72" y1="788" x2="112" y2="788" stroke="#1d6fb8" stroke-width="3.5"/><text x="122" y="792" font-size="12" text-anchor="start" font-family="Arial, sans-serif" fill="#222222">Rücklauf / Kaltwasser</text><text x="60" y="880" font-size="12" text-anchor="start" font-family="Arial, sans-serif" fill="#222222">P1 = WP-Pumpe · P4 = FriWa-Primärpumpe · P5/P6 = Heizkreispumpen · M = 3-Wege-Mischer · SV = Sicherheitsventil · MAG = Ausdehnungsgefäß</text><text x="60" y="902" font-size="12" text-anchor="start" font-family="Arial, sans-serif" fill="#222222">WP muss dauerhaft ~60 °C liefern → reduzierte JAZ (ggf. Hochtemperatur-/Propan-WP) · Schichtung im Kombispeicher entscheidend · Zirkulation erhöht den Primär-Rücklauf</text><text x="1440" y="930" font-size="10" text-anchor="end" font-family="Arial, sans-serif" fill="#222222">Erstellt für Software Wärmeplan · Schemadarstellung, keine Ausführungsplanung</text></svg>