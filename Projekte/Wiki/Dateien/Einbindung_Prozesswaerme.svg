  <text x="740.0" y="161.5" font-size="13" fill="#57606a" text-anchor="middle">Vorlauf 80 °C</text>
  <text x="740.0" y="178.5" font-size="13" fill="#57606a" text-anchor="middle">Rücklauf 60 °C</text>
  <text x="740.0" y="195.5" font-size="13" fill="#57606a" text-anchor="middle">Zweischicht 5 Tage</text>
  <path d="M440,128 L560,128 L560,140 L633.5,140" fill="none" stroke="#c56a1a" stroke-width="3" stroke-linejoin="round" marker-end="url(#pfeil-1)"/>
