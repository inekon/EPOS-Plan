  <text x="530" y="291" font-size="13" fill="#57606a" text-anchor="middle">Laden</text>
  <text x="530" y="343" font-size="13" fill="#57606a" text-anchor="middle">Entladen</text>
  <rect x="580" y="280" width="170" height="62" rx="8" fill="#f2edf6" stroke="#7b4fa3" stroke-width="2"/>
