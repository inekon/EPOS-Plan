  <path d="M106,110 L150,110 L134,158 L90,158 Z" fill="#f1e9d1" stroke="#b38600" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M113.8,113 L99.8,155 M122.6,113 L108.6,155 M131.4,113 L117.4,155 M140.2,113 L126.2,155" stroke="#b38600" stroke-width="1" fill="none"/>
  <path d="M156,110 L200,110 L184,158 L140,158 Z" fill="#f1e9d1" stroke="#b38600" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M163.8,113 L149.8,155 M172.6,113 L158.6,155 M181.4,113 L167.4,155 M190.2,113 L176.2,155" stroke="#b38600" stroke-width="1" fill="none"/>
  <path d="M206,110 L250,110 L234,158 L190,158 Z" fill="#f1e9d1" stroke="#b38600" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M213.8,113 L199.8,155 M222.6,113 L208.6,155 M231.4,113 L217.4,155 M240.2,113 L226.2,155" stroke="#b38600" stroke-width="1" fill="none"/>
  <path d="M247,118 L310,118 L310,392 L353.5,392" fill="none" stroke="#b38600" stroke-width="3" stroke-linejoin="round" marker-end="url(#pfeil-1)"/>
  <path d="M360,444 L140,444 L140,164.5" fill="none" stroke="#b38600" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 5" marker-end="url(#pfeil-1)"/>
  <circle cx="140" cy="300" r="9" fill="#fcfcfb" stroke="#57606a" stroke-width="1.6"/>
  <path d="M140,291 L147.8,304.5 L132.2,304.5 Z" fill="#57606a"/>
  <text x="126" y="305" font-size="13" fill="#57606a" text-anchor="end">Solarstation</text>
