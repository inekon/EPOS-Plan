# =====================================================================================
# Setup-Lauf: faehrt die Freigabekette aus Setup/Konzept_Setup_InnoSetup_EPOS-Plan.md 8.1
# einmal komplett durch - Veroeffentlichung (win-x64, eigenstaendig), Auslieferungsvorlage,
# Inno Setup - und legt Installer, Pruefbericht und Skriptprotokoll als Artefakte ab.
#
# WOZU. Der Handlauf braucht Windows, das .NET-SDK aus global.json und Inno Setup 6.3 oder
# neuer. Auf einem Linux-Arbeitsplatz gibt es weder PowerShell noch ISCC; dieser Job ist
# deshalb der einzige Ort, an dem sich die Kette ueberhaupt fahren laesst - Anwenderentscheid
# vom 11.09.2026 ("#160-E-1: CI").
#
# WARUM VON HAND. windows-latest zaehlt DOPPELT auf das Actions-Kontingent, und der Lauf ist
# teuer: eigenstaendige Veroeffentlichung, 186 MB Herstellerdaten (VDI-3805-Daten) und eine
# rund 60 MB grosse Auslieferungsvorlage gehen durch die LZMA2-Solidkompression. Es gibt
# deshalb weder Push- noch Zeitausloeser - nur Actions -> Setup -> Run workflow.
#
# WAS DER JOB BEWEIST. Dass "dotnet publish" die Anwendung eigenstaendig fuer win-x64
# veroeffentlicht und die gebaute EXE eine brauchbare Versionsnummer traegt; dass
# Werkzeuge\Auslieferungsvorlage aus einer Quelldatenbank eine bereinigte Vorlage samt
# Pruefbericht erzeugt und mit 0 zurueckkehrt (Datenschutzwaechter eingeschlossen); dass
# ISCC das .iss uebersetzt und unter Setup\Ausgabe ein benanntes Setup entsteht.
# WAS ER NICHT BEWEISEN KANN: die CODE-SIGNATUR (Abschnitt 9 - dafuer braucht es das
# Zertifikat, und Geheimnisse hat dieser Job bewusst keine), die INSTALLATION auf einem
# Rechner, den ERSTSTART und damit die Erstkopie der Vorlagendatenbank (Abschnitt 6.2).
# Die Freigabeprobe aus Abschnitt 8 bleibt Handarbeit auf einer frischen Windows-
# Installation.
#
# DIE QUELLE DER VORLAGE ist Referenzlaeufe/Kenndaten_Test.sqlite - die einzige Datenbank im
# Repository. Sie fuehrt 24 Pruefprojekte; das Werkzeug loescht ALLE Projektdaten (Konzept
# 6.1, Schritt 2) und weist das im Pruefbericht nach, der hier ausgegeben und mitgeliefert
# wird. Das Ergebnis ist damit ein PRUEFSTUECK, kein Auslieferungsstand: Fuer eine echte
# Auslieferung ist die Quelle ein gepflegter Katalogstand vom Arbeitsplatz (8.1, Schritt 3).
#
# -Kataloge alle ist gesetzt, weil der Katalogwaechter (#160-F-1) sonst mit Code 4 abbricht.
# Der Entscheid #160-E-1 zur ReadOnly-Regel selbst ist damit NICHT vorweggenommen: Der Job
# uebergibt den Schalter ausdruecklich, die Vorgabe des Werkzeugs bleibt "readonly".
# =====================================================================================
name: Setup

# Kein push, kein schedule - siehe Kopf. Der eine Eingabeschalter reicht -Schnell durch:
# lzma2/normal statt lzma2/max halbiert die Uebersetzungszeit und genuegt fuer einen reinen
# Kettennachweis, falls der Lauf ans Zeitlimit kommt.
on:
  workflow_dispatch:
    inputs:
      schnell:
        description: 'Schnell uebersetzen (lzma2/normal statt lzma2/max) - halbe Zeit, groessere Datei'
        type: boolean
        default: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # SDK-Fassung aus global.json (10.0.400) - gleiche Quelle wie windows.yml und
      # kern.yml. build-setup.ps1 prueft selbst, dass "dotnet" ueberhaupt da ist.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # windows-latest bringt Inno Setup 6 unter "Program Files (x86)\Inno Setup 6" mit.
      # Der Schritt prueft das, statt es zu glauben: Das Runner-Image wandert, und ein
      # fehlendes ISCC.exe faellt sonst erst nach der minutenlangen Veroeffentlichung auf.
      # choco legt denselben Pfad an, deshalb braucht der Aufruf unten kein -Iscc
      # (Suchreihenfolge des Skripts: -Iscc -> EPOS_ISCC -> neben dem Skript ->
      # Program Files -> Registry, Auftrag #164). "-y" ist noetig, weil choco sonst auf
      # eine Bestaetigung wartet; das Skript verlangt Fassung 6.3 oder neuer.
      - name: Inno Setup bereitstellen
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            Write-Host "ISCC.exe fehlt im Runner-Image - wird nachinstalliert."
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe nicht gefunden: $iscc" }
          Write-Host ("Inno Setup " + (Get-Item $iscc).VersionInfo.FileVersion + " : " + $iscc)

      # Der WebView2-Bootstrapper liegt NICHT im Repository (.gitignore:
      # /MicrosoftEdgeWebview2Setup.exe) - er ist eine Fremddatei von rund 2 MB.
      # build-setup.ps1 erwartet ihn in der Repowurzel und kopiert ihn von dort nach
      # Setup\Voraussetzungen; das .iss packt ihn ohne Ausweichweg mit ein
      # (Source: {#WebView2Installer}). Ohne diesen Schritt braeche der Lauf sofort ab.
      # Die Adresse ist die im Skript und in Konzept 5.5 genannte Bezugsquelle.
      - name: WebView2-Bootstrapper laden
        shell: pwsh
        run: |
          $ziel = Join-Path $env:GITHUB_WORKSPACE 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $ziel
          $kb = [math]::Round((Get-Item $ziel).Length / 1KB, 0)
          if ($kb -lt 500) { throw "Der Bootstrapper ist unglaubwuerdig klein ($kb KB) - Abbruch." }
          Write-Host "MicrosoftEdgeWebview2Setup.exe: $kb KB"

      # Der eigentliche Lauf (Konzept 8.1, Schritt 3). Die Quelle wird ABSOLUT uebergeben:
      # build-setup.ps1 reicht den Pfad an "dotnet run --project Werkzeuge\Auslieferungs-
      # vorlage" weiter, und ein relativer Pfad haenge dort am Arbeitsverzeichnis des
      # Kindprozesses. Kein -Beispiele: Das Repository fuehrt keinen gepflegten
      # Beispielsatz, und ohne den Schalter bleibt die Vorlage projektfrei (Konzept 6.1,
      # Schritt 4). Auf Rueckgabe 0 wird bestanden.
      - name: Setup bauen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/setup | Out-Null
          # Das Skript und die Werkzeuge darunter schreiben viel auf stderr; mit
          # ErrorActionPreference = Stop (Vorgabe der pwsh-Schale) waere jede solche
          # Zeile bzw. jeder Rueckgabecode <> 0 ein sofortiger Abbruch OHNE Protokoll.
          # Deshalb hier ausdruecklich weich - der Rueckgabecode wird selbst geprueft.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $quelle = Join-Path $env:GITHUB_WORKSPACE 'Referenzlaeufe\Kenndaten_Test.sqlite'
          $aufruf = @('-File', 'Setup/build-setup.ps1', '-Quelldatenbank', $quelle, '-Kataloge', 'alle')
          if ('${{ inputs.schnell }}' -eq 'true') { $aufruf += '-Schnell' }
          Write-Host ("Aufruf: pwsh " + ($aufruf -join ' '))

          pwsh @aufruf 2>&1 | Tee-Object -FilePath artifacts/setup/build-setup.log
          $code = $LASTEXITCODE
          Write-Host "build-setup.ps1 Rueckgabe: $code"
          if ($code -ne 0) { exit $code }

      # Der Pruefbericht der Auslieferungsvorlage (Konzept 6.1): je Tabelle die Zeilen
      # vorher und nachher, Katalogzahlen, geleerte Felder, Projektliste und jede
      # Pruefzeile. Er ist der Beleg dafuer, dass keine Projektdaten in den Installer
      # gewandert sind - deshalb steht er im Lauf und nicht nur im Artefakt.
      - name: Pruefbericht der Auslieferungsvorlage
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/setup | Out-Null
          $bericht = 'Setup/Vorlage/Kenndaten.sqlite.bericht.txt'
          if (Test-Path $bericht) {
            Copy-Item $bericht artifacts/setup -Force
            Get-Content $bericht
          }
          else {
            Write-Host "Kein Pruefbericht vorhanden ($bericht) - der Lauf kam nicht bis zur Vorlage."
          }

      - name: Ergebnis auflisten
        if: always()
        shell: pwsh
        run: |
          if (Test-Path Setup/Ausgabe) {
            Get-ChildItem Setup/Ausgabe -File |
              ForEach-Object { "{0}  {1} MB" -f $_.Name, [math]::Round($_.Length / 1MB, 1) }
          }
          else { Write-Host 'Setup/Ausgabe fehlt - es wurde kein Setup uebersetzt.' }

      # Das Pruefstueck selbst - rund 150 bis 250 MB, je nach Kompression. Deshalb nur
      # 14 Tage und nur bei Erfolg: Ohne uebersetztes Setup gibt es nichts hochzuladen.
      - name: Installer als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: epos-plan-setup
          path: Setup/Ausgabe/EPOS-Plan_Setup_*.exe
          if-no-files-found: error
          retention-days: 14

      # Pruefbericht und Skriptprotokoll auch dann, wenn der Lauf gescheitert ist - sie
      # sagen, woran.
      - name: Pruefbericht und Protokoll als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-protokoll
          path: artifacts/setup
          if-no-files-found: warn
          retention-days: 14
