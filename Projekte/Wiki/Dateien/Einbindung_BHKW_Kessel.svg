<!--
Einbindung eines BHKW mit zwei Spitzenlastkesseln (Beispielanlage B, Hotel mit 80 Zimmern)

Inhalt: BHKW 1 (30 kW elektrisch, 60 kW thermisch) sowie Kessel 1 und Kessel 2 (je 150 kW)
laden über einen Vorlauf- und einen Rücklaufsammler einen Pufferspeicher mit 3 000 l. Die
Kaskade legt die Reihenfolge fest: 1 BHKW 1 (Grundlast), 2 Kessel 1, 3 Kessel 2
(Spitzenlast). Der Puffer versorgt Heizung und Lüftung (Heizkörper 60/45 °C) und die
Nachheizung im oberen Teil eines Warmwasserspeichers. Solarkollektoren mit 50 m² wärmen das
Trinkwasser im unteren Teil dieses Speichers vor. Der Strom des BHKW deckt zuerst den Bedarf
im Hausnetz; der Überschuss geht über den Zähler ins Netz, fehlender Strom wird bezogen.

Annahmen: Alle Erzeuger holen ihren Rücklauf unten aus dem Puffer, damit das BHKW kaltes
Wasser zur Kühlung bekommt und lange am Stück läuft. Mischventile, Brennstoffleitungen und
Sicherheitstechnik sind der Übersicht halber weggelassen.

Darstellung: Vorlauf durchgezogen, Rücklauf gestrichelt in derselben Farbe, Pfeile in
Fließrichtung, Ziffern in Kreisen für die Reihenfolge der Kaskade. Farben nach
Vorlage:Diagrammfarbe (bhkw, kessel, waerme, solar, strom, netz, speicher). Prinzipbild mit
gerundeten Beispielwerten, keinem Produkt zugeordnet.
-->
