a"/></g><rect x="848.2" y="185" width="63.6" height="16" rx="4" fill="white" stroke="#e8862a" stroke-width="1.2"/><text x="880" y="197.5" font-size="11" text-anchor="middle" font-family="Arial, sans-serif" fill="#e8862a">60–90 °C</text><text x="800" y="262" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="#e8862a">Solarkreis</text><rect x="6" y="6" width="1488" height="938" fill="none" stroke="#222222" stroke-width="2"/><text x="750.0" y="40" font-size="22" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222" font-weight="bold">BHKW-Schema 10 – Erweiterung: Solarthermie auf dem Pufferspeicher</text><text x="750.0" y="64" font-size="14" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222">Solarkollektoren laden über einen internen Wärmetauscher die untere Pufferzone; das BHKW deckt die Grundlast auf den Puffer, der Kessel speist parallel bei Spitzenlast</text><rect x="60" y="720" width="250" height="112" fill="white" stroke="#222222" stroke-width="1.5"/><text x="72" y="742" font-size="14" text-anchor="start" font-family="Arial, sans-serif" fill="#222222" font-weight="bold">Legende</text><line x1="72" y1="764" x2="112" y2="764" stroke="#c81e1e" stroke-width="3.5"/><text x="122" y="768" font-size="12" text-anchor="start" font-family="Arial, sans-serif" fill="#222222">Vorlauf</text><line x1="72" y1="788" x2="112" y2="788" stroke="#1d6fb8" stroke-width="3.5"/><text x="122" y="792" font-size="12" text-anchor="start" font-family="Arial, sans-serif" fill="#222222">Rücklauf</text><line x1="72" y1="812" x2="112" y2="812" stroke="#e8862a" stroke-width="3.5"/><text x="122" y="816" font-size="12" text-anchor="start" font-family="Arial, sans-serif" fill="#222222">Solarkreis</text><text x="60" y="880" font-size="12" text-anchor="start" font-family="Arial, sans-serif" fill="#222222">P1 = BHKW-Pumpe · P2 = Kesselpumpe · PS = Solarkreispumpe · P5/P6 = Heizkreispumpen · SV = Sicherheitsventil · MAG = Ausdehnungsgefäß</text><text x="60" y="902" font-size="12" text-anchor="start" font-family="Arial, sans-serif" fill="#222222">Solar lädt unten (niedrige Temperatur = hoher Kollektorertrag), BHKW lädt oben · Solarkreis mit Frostschutz; eigene Sicherheitsgruppe/MAG des Solarkreises nicht dargestellt</text><text x="1440" y="930" font-size="10" text-anchor="end" font-family="Arial, sans-serif" fill="#222222">Erstellt für Software Wärmeplan · Schemadarstellung, keine Ausführungsplanung</text></svg>