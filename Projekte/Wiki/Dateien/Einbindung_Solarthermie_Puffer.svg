  <text x="240" y="487" font-size="13" fill="#57606a" text-anchor="middle">unten im Speicher</text>
  <!-- Geschichteter Pufferspeicher -->
  <rect x="360" y="112" width="140" height="380" rx="70" ry="24" fill="url(#schichtung)" stroke="#7b4fa3" stroke-width="2"/>
  <path d="M360,392 L452,392 L368,405 L452,418 L368,431 L452,444 L360,444" fill="none" stroke="#b38600" stroke-width="2" stroke-linejoin="round"/>
  <text x="430" y="150" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">heiß</text>
  <text x="430" y="167" font-size="13" fill="#1f2328" text-anchor="middle">rund 60 °C</text>
  <path d="M366,258 L494,258" stroke="#57606a" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="430" y="249" font-size="13" fill="#1f2328" text-anchor="middle">Bereitschaftsteil</text>
  <text x="430" y="277" font-size="13" fill="#1f2328" text-anchor="middle">Solarteil</text>
  <text x="430" y="464" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">kalt</text>
  <text x="430" y="481" font-size="13" fill="#1f2328" text-anchor="middle">rund 25 °C</text>
  <text x="430" y="516" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="600">Pufferspeicher</text>
  <!-- Nachheizung -->
  <rect x="556" y="150" width="124" height="110" rx="8" fill="#f4eeec" stroke="#8c5a3c" stroke-width="2"/>
  <text x="618" y="192.7" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="600">Nachheizung</text>
  <text x="618" y="209.7" font-size="13" fill="#57606a" text-anchor="middle">Kessel oder</text>
  <text x="618" y="226.7" font-size="13" fill="#57606a" text-anchor="middle">Wärmepumpe</text>
  <path d="M556,170 L506.5,170" fill="none" stroke="#c56a1a" stroke-width="3" stroke-linejoin="round" marker-end="url(#pfeil-2)"/>
  <path d="M500,244 L549.5,244" fill="none" stroke="#c56a1a" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 5" marker-end="url(#pfeil-2)"/>
  <circle cx="528" cy="244" r="9" fill="#fcfcfb" stroke="#57606a" stroke-width="1.6"/>
  <path d="M537,244 L523.5,251.8 L523.5,236.2 Z" fill="#57606a"/>
  <!-- Entnahme oben: Warmwasser und Heizung -->
  <path d="M430,112 L430,88 L700,88 L700,316 L709.5,316" fill="none" stroke="#c56a1a" stroke-width="3" stroke-linejoin="round" marker-end="url(#pfeil-2)"/>
  <path d="M700,216 L709.5,216" fill="none" stroke="#c56a1a" stroke-width="3" stroke-linejoin="round" marker-end="url(#pfeil-2)"/>
  <circle cx="700" cy="216" r="4" fill="#c56a1a"/>
  <rect x="716" y="190" width="140" height="60" rx="8" fill="#f9f0e8" stroke="#c56a1a" stroke-width="2"/>
  <text x="786" y="216.2" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="600">Warmwasser</text>
  <text x="786" y="233.2" font-size="13" fill="#57606a" text-anchor="middle">Frischwasserstation</text>
  <rect x="716" y="290" width="140" height="60" rx="8" fill="#f9f0e8" stroke="#c56a1a" stroke-width="2"/>
  <text x="786" y="316.2" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="600">Heizung</text>
  <text x="786" y="333.2" font-size="13" fill="#57606a" text-anchor="middle">Heizkreis</text>
  <!-- Rücklauf unten -->
  <path d="M856,230 L876,230 L876,462 L506.5,462" fill="none" stroke="#c56a1a" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 5" marker-end="url(#pfeil-2)"/>
  <path d="M786,350 L786,462" fill="none" stroke="#c56a1a" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 5"/>
  <circle cx="786" cy="462" r="4" fill="#c56a1a"/>
  <!-- Legende -->
  <path d="M28,550 L58,550" stroke="#c56a1a" stroke-width="3"/>
  <text x="66" y="554.5" font-size="13" fill="#57606a">Vorlauf</text>
  <path d="M140.8,550 L171.8,550" stroke="#c56a1a" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="179.8" y="554.5" font-size="13" fill="#57606a">Rücklauf</text>
  <path d="M262.1,550 L292.1,550" stroke="#b38600" stroke-width="3"/>
  <text x="300.1" y="554.5" font-size="13" fill="#57606a">Solarkreis Vorlauf</text>
  <path d="M457.8,550 L488.8,550" stroke="#b38600" stroke-width="3" stroke-dasharray="8 5"/>
  <text x="496.8" y="554.5" font-size="13" fill="#57606a">Solarkreis Rücklauf</text>
  <circle cx="671.1" cy="550" r="9" fill="#fcfcfb" stroke="#57606a" stroke-width="1.6"/>
  <path d="M680.1,550 L666.6,557.8 L666.6,542.2 Z" fill="#57606a"/>
  <text x="688.1" y="554.5" font-size="13" fill="#57606a">Pumpe</text>
  <text x="28" y="582" font-size="13" fill="#57606a">Prinzipbild · Beispielwerte, gerundet</text>
</svg>
