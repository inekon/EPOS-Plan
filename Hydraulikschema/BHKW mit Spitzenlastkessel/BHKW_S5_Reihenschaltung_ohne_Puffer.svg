s 2</text><text x="1215.0" y="236" font-size="10.5" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222">(z. B. FBH / Lüftung)</text><polyline points="1280,150 1380,150 1380,430" fill="none" stroke="#1d6fb8" stroke-width="3.5" stroke-linejoin="round"/><polyline points="1280,230 1340,230 1340,430" fill="none" stroke="#1d6fb8" stroke-width="3.5" stroke-linejoin="round"/><circle cx="1340" cy="430" r="5" fill="#1d6fb8"/><rect x="1348.2" y="307" width="63.6" height="16" rx="4" fill="white" stroke="#1d6fb8" stroke-width="1.2"/><text x="1380" y="319.5" font-size="11" text-anchor="middle" font-family="Arial, sans-serif" fill="#1d6fb8">50–60 °C</text><polyline points="1380,430 560,430 560,500 290,500" fill="none" stroke="#1d6fb8" stroke-width="3.5" stroke-linejoin="round"/><g transform="translate(1000,430) rotate(180)"><polygon points="0,-6 12,0 0,6" fill="#1d6fb8"/></g><g transform="translate(700,430) rotate(180)"><polygon points="0,-6 12,0 0,6" fill="#1d6fb8"/></g><g transform="translate(560,475) rotate(90)"><polygon points="0,-6 12,0 0,6" fill="#1d6fb8"/></g><g transform="translate(400,500) rotate(180)"><polygon points="0,-6 12,0 0,6" fill="#1d6fb8"/></g><g transform="translate(470,500)"><line x1="0" y1="0" x2="0" y2="14" stroke="#222222" stroke-width="2"/><circle cx="0" cy="30" r="16" fill="white" stroke="#222222" stroke-width="2"/><line x1="-16" y1="30" x2="16" y2="30" stroke="#222222" stroke-width="2"/><path d="M -16 30 A 16 16 0 0 0 16 30" fill="#dddddd" stroke="none"/><circle cx="0" cy="30" r="16" fill="none" stroke="#222222" stroke-width="2"/></g><text x="470" y="562" font-size="11" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222">MAG</text><rect x="6" y="6" width="1488" height="938" fill="none" stroke="#222222" stroke-width="2"/><text x="750.0" y="40" font-size="22" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222" font-weight="bold">BHKW-Schema 5 – Reihenschaltung ohne Pufferspeicher (Rücklaufanhebung)</text><text x="750.0" y="64" font-size="14" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222">BHKW hebt die Rücklauftemperatur an, der Kessel heizt in Reihe nach – sinnvoll nur bei gleichzeitigem Strom- und Wärmebedarf; nicht für Brennwertkessel (ASUE Variante 1)</text><rect x="60" y="720" width="250" height="88" fill="white" stroke="#222222" stroke-width="1.5"/><text x="72" y="742" font-size="14" text-anchor="start" font-family="Arial, sans-serif" fill="#222222" font-weight="bold">Legende</text><line x1="72" y1="764" x2="112" y2="764" stroke="#c81e1e" stroke-width="3.5"/><text x="122" y="768" font-size="12" text-anchor="start" font-family="Arial, sans-serif" fill="#222222">Vorlauf</text><line x1="72" y1="788" x2="112" y2="788" stroke="#1d6fb8" stroke-width="3.5"/><text x="122" y="792" font-size="12" text-anchor="start" font-family="Arial, sans-serif" fill="#222222">Rücklauf</text><text x="60" y="880" font-size="12" text-anchor="start" font-family="Arial, sans-serif" fill="#222222">P1 = BHKW-Pumpe · P5/P6 = Heizkreispumpen · SV = Sicherheitsventil · MAG = Ausdehnungsgefäß · Rückschlagklappen verhindern Fehlzirkulation bei Stillstand</text><text x="60" y="902" font-size="12" text-anchor="start" font-family="Arial, sans-serif" fill="#222222">Ohne Puffer läuft das BHKW nur bei Wärmebedarf · Rücklaufanhebung verhindert Brennwertnutzung · BHKW-Rücklauf &lt; 70 °C für volle Wärmeauskopplung</text><text x="1440" y="930" font-size="10" text-anchor="end" font-family="Arial, sans-serif" fill="#222222">Erstellt für Software Wärmeplan · Schemadarstellung, keine Ausführungsplanung</text></svg>