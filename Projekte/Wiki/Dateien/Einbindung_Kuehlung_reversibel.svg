<!--
Reversible Luft-Wasser-Wärmepumpe mit Heiz- und Kühlbetrieb (Beispielanlage D, Bürogebäude)

Inhalt: Dieselbe Wärmepumpe A (reversibel, 100 kW) arbeitet im Winter als Heizung und im
Sommer als Kältemaschine. Ein Umschaltventil im Vorlauf schickt das Wasser entweder in die
Flächenheizung (40/30 °C) oder in die Kühldecken (16/19 °C); die Rückläufe führen gemeinsam
zur Wärmepumpe zurück. Links der Heizbetrieb: Die Wärmepumpe nimmt Umweltwärme aus der
Außenluft auf. Rechts der Kühlbetrieb: Der Kältekreis ist umgekehrt, die Wärme aus dem
Gebäude geht als Abwärme an die Außenluft. Der jeweils nicht genutzte Kreis ist grau, der
geschlossene Anschluss des Ventils gefüllt.

Annahmen: Der Vorlauf der Kühldecken bleibt über dem Taupunkt der Raumluft, damit sich kein
Kondensat bildet. Pufferspeicher und Kessel 1 der Beispielanlage D sind der Übersicht halber
nicht dargestellt.

Darstellung: Vorlauf durchgezogen, Rücklauf gestrichelt in derselben Farbe, Pfeile in
Fließrichtung. Farben nach Vorlage:Diagrammfarbe (waerme für Heizwasser und Abwärme, kaelte
für Kühlwasser, umwelt, strom). Prinzipbild mit gerundeten Beispielwerten, keinem Produkt
zugeordnet.
-->
