<!--
Einbindung von Photovoltaik und Stromspeicher in das Hausnetz (Beispielanlagen A und C)

Inhalt: Zwei Modulfelder mit unterschiedlicher Ausrichtung (Süd und West) liegen an je einem
MPP-Tracker desselben Wechselrichters. Der Wechselrichter speist den Solarstrom als
Wechselstrom in das Hausnetz. Dort versorgen Haushalt und Wärmepumpe sich zuerst; der
Stromspeicher ist mit eigenem Wechselrichter am Hausnetz angeschlossen (AC-Kopplung) und
wird aus Überschuss geladen und bei Bedarf entladen. Über den Zweirichtungszähler fließt der
verbleibende Überschuss ins Netz, fehlender Strom wird aus dem Netz bezogen.

Nebenskizze: Variante mit DC-Kopplung. Der Speicher hängt am Gleichstromkreis eines
Hybridwechselrichters und wird vor der Umwandlung in Wechselstrom geladen.

Annahmen: Prinzipbild ohne Leistungswerte. Pfeile zeigen die möglichen Energieflüsse, nicht
gleichzeitige Werte. Farben nach Vorlage:Diagrammfarbe (solar für Gleichstrom aus den
Modulen, strom für Wechselstrom, speicher, waerme, netz). Keinem Produkt zugeordnet.
-->
