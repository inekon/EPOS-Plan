<!--
Einbindung einer Luft-Wasser-Wärmepumpe mit Spitzenlastkessel (Beispielanlage A)

Inhalt: Wärmepumpe A (Luft-Wasser, rund 25 kW bei A−7/W55, Heizstab als Option) und
Kessel 1 (Brennwert, 50 kW, Spitzenlast) laden einen Pufferspeicher mit 1 000 l. Der
Puffer versorgt den Heizkreis mit Heizkörpern 55/45 °C (Mischventil und Pumpe) und die
Trinkwarmwasserbereitung (Frischwasserstation mit Zirkulation).

Annahmen: bivalent-paralleler Betrieb. Die Wärmepumpe lädt den ganzen Speicher und holt
ihren Rücklauf unten; der Kessel lädt nur den oberen Teil (Rücklauf aus der Mitte), damit
der untere Teil für die Wärmepumpe frei bleibt. Die Warmwasserbereitung entnimmt ganz oben
und gibt ihren kalten Rücklauf ganz unten zurück, der Heizkreis darüber.

Darstellung: Vorlauf durchgezogen, Rücklauf gestrichelt in derselben Farbe, Pfeile in
Fließrichtung. Farben nach Vorlage:Diagrammfarbe (waerme, kessel, strom, umwelt,
speicher). Prinzipbild mit gerundeten Beispielwerten, keinem Produkt zugeordnet.
-->
