form="translate(950,285) rotate(180)"><polygon points="0,-6 12,0 0,6" fill="#1d6fb8"/></g><circle cx="740" cy="405" r="5" fill="#1d6fb8"/><rect x="1048.2" y="61" width="63.6" height="16" rx="4" fill="white" stroke="#222222" stroke-width="1.2"/><text x="1080" y="73.5" font-size="11" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222">45/35 °C</text><rect x="1092.2" y="217" width="63.6" height="16" rx="4" fill="white" stroke="#222222" stroke-width="1.2"/><text x="1124" y="229.5" font-size="11" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222">35/28 °C</text><rect x="6" y="6" width="1488" height="938" fill="none" stroke="#222222" stroke-width="2"/><text x="750.0" y="40" font-size="22" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222" font-weight="bold">Hydraulikschema Wärmepumpe ohne Booster-WP · Variante 3 – Puffer nur für Spitzenlast</text><text x="750.0" y="64" font-size="14" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222">WP direkt auf die Heizkreise; Puffer lädt bei Schwachlast, entlädt bei Spitzenlast</text><rect x="60" y="720" width="250" height="88" fill="white" stroke="#222222" stroke-width="1.5"/><text x="72" y="742" font-size="14" text-anchor="start" font-family="Arial, sans-serif" fill="#222222" font-weight="bold">Legende</text><line x1="72" y1="764" x2="112" y2="764" stroke="#c81e1e" stroke-width="3.5"/><text x="122" y="768" font-size="12" text-anchor="start" font-family="Arial, sans-serif" fill="#222222">Vorlauf / Warmwasser</text><line x1="72" y1="788" x2="112" y2="788" stroke="#1d6fb8" stroke-width="3.5"/><text x="122" y="792" font-size="12" text-anchor="start" font-family="Arial, sans-serif" fill="#222222">Rücklauf / Kaltwasser</text><text x="60" y="880" font-size="12" text-anchor="start" font-family="Arial, sans-serif" fill="#222222">P1 = WP-Pumpe · P3 = Speicherladepumpe · P4 = Speicherentladepumpe · P5/P6 = Heizkreispumpen · M = 3-Wege-Mischer · SV = Sicherheitsventil · MAG = Ausdehnungsgefäß</text><text x="60" y="902" font-size="12" text-anchor="start" font-family="Arial, sans-serif" fill="#222222">Entladung nur bei Spitzenlast, WP-Sperrzeit (EVU) oder Abtauung · direkte Versorgung = keine Speicherverluste im Normalbetrieb · WW-Bereitung separat (vgl. Variante 1/2) · auch mit Booster-WP kombinierbar</text><text x="1440" y="930" font-size="10" text-anchor="end" font-family="Arial, sans-serif" fill="#222222">Erstellt für Software Wärmeplan · Schemadarstellung, keine Ausführungsplanung</text></svg>