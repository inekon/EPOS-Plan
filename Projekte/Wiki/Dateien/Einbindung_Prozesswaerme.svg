<?xml version="1.0" encoding="UTF-8"?>
<!--
Hydraulische Einbindung der Prozesswärme (Prinzipbild)

Inhalt: Eine Wärmepumpe (Vorlauf bis 70 °C) und ein Heizkessel (Vorlauf 80 °C) laden
gemeinsam einen geschichteten Pufferspeicher mit der Nutzung Prozesswärme (2 000 l). Die
Ladepriorität entscheidet, wer zuerst lädt: die Wärmepumpe vor dem Kessel. Der Puffer versorgt
einen Prozess mit dem Temperaturpaar 60/40 °C und mit dem, was übrig bleibt, den Heizkreis
45/35 °C; bei knappem Vorrat geht der Prozess vor. Der Puffer gibt an den Prozess nur Wärme
ab, die den Prozessvorlauf hält.

Annahmen: Pumpen, Mischer, Übertrager und Sicherheitstechnik sind weggelassen.

Darstellung: Vorlauf durchgezogen, Rücklauf gestrichelt, Pfeile in Fließrichtung. Ziffern in
Kreisen verweisen auf die Erläuterung unten. Farben nach Vorlage:Diagrammfarbe (waerme,
kessel, speicher, netz). Prinzipbild mit gerundeten Beispielwerten, keinem Produkt zugeordnet.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<defs>
  <linearGradient id="schichtung" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e5bc98"/><stop offset="0.5" stop-color="#f3e1d1"/><stop offset="1" stop-color="#d7edf1"/></linearGradient>
  <marker id="pfeil-1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#c56a1a"/></marker>
  <marker id="pfeil-2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#57606a"/></marker>
  <marker id="pfeil-3" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#1f9bb0"/></marker>
  <marker id="pfeil-4" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#7b4fa3"/></marker>
</defs>
  <rect x="1" y="1" width="898" height="618" rx="12" fill="#fcfcfb" stroke="#d0d7de" stroke-width="1"/>
  <text x="28" y="38" font-size="18" fill="#1f2328" text-anchor="start" font-weight="600">Prozesswärme: zwei Erzeuger laden einen gemeinsamen Pufferspeicher</text>
  <text x="28" y="61" font-size="14" fill="#57606a" text-anchor="start">Prinzipbild, Beispielwerte gerundet</text>
  <rect x="40" y="100" width="200" height="104" rx="8" fill="#f9f0e8" stroke="#c56a1a" stroke-width="2"/>
  <text x="140" y="126" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">Wärmepumpe</text>
  <text x="140" y="145" font-size="13" fill="#57606a" text-anchor="middle">Vorlauf bis 70 °C</text>
  <rect x="56" y="158" width="168" height="34" rx="6" fill="#ffffff" stroke="#c56a1a"/>
  <text x="140" y="173" font-size="13" fill="#c56a1a" text-anchor="middle" font-weight="600">Ladepriorität 1</text>
  <text x="140" y="187" font-size="12" fill="#57606a" text-anchor="middle">lädt zuerst</text>
  <rect x="40" y="290" width="200" height="104" rx="8" fill="#f4eeec" stroke="#8c5a3c" stroke-width="2"/>
  <text x="140" y="316" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">Heizkessel</text>
  <text x="140" y="335" font-size="13" fill="#57606a" text-anchor="middle">Vorlauf 80 °C</text>
  <rect x="56" y="348" width="168" height="34" rx="6" fill="#ffffff" stroke="#8c5a3c"/>
  <text x="140" y="363" font-size="13" fill="#8c5a3c" text-anchor="middle" font-weight="600">Ladepriorität 2</text>
  <text x="140" y="377" font-size="12" fill="#57606a" text-anchor="middle">lädt, was noch fehlt</text>
  <rect x="390" y="100" width="120" height="294" rx="16" fill="url(#schichtung)" stroke="#7b4fa3" stroke-width="2.5"/>
  <text x="450" y="232" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">Prozess-</text>
  <text x="450" y="250" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">puffer</text>
  <text x="450" y="272" font-size="13" fill="#1f2328" text-anchor="middle">2 000 l</text>
  <text x="450" y="90" font-size="12" fill="#7b4fa3" text-anchor="middle" font-weight="600">gemeinsames Ladeziel</text>
  <path d="M240,130 L390,130" fill="none" stroke="#c56a1a" stroke-width="3" marker-end="url(#pfeil-1)"/>
  <path d="M390,190 L240,190" fill="none" stroke="#57606a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#pfeil-2)"/>
  <path d="M240,310 L320,310 L320,150 L390,150" fill="none" stroke="#8c5a3c" stroke-width="3" marker-end="url(#pfeil-1)"/>
  <path d="M390,370 L240,370" fill="none" stroke="#57606a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#pfeil-2)"/>
  <circle cx="290" cy="114" r="11" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="290" y="119" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">1</text>
  <rect x="640" y="100" width="220" height="104" rx="8" fill="#ffffff" stroke="#c56a1a" stroke-width="2"/>
  <text x="750" y="126" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">Prozess</text>
  <text x="750" y="145" font-size="13" fill="#57606a" text-anchor="middle">Vorlauf 60 °C, Rücklauf 40 °C</text>
  <text x="750" y="164" font-size="13" fill="#57606a" text-anchor="middle">Schichtbetrieb</text>
  <text x="750" y="186" font-size="12" fill="#c56a1a" text-anchor="middle" font-weight="600">Vorrang bei knappem Vorrat</text>
  <path d="M510,130 L640,130" fill="none" stroke="#c56a1a" stroke-width="3" marker-end="url(#pfeil-1)"/>
  <path d="M640,185 L510,185" fill="none" stroke="#57606a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#pfeil-2)"/>
  <circle cx="575" cy="114" r="11" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="575" y="119" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">3</text>
  <rect x="640" y="290" width="220" height="104" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
  <text x="750" y="316" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">Heizkreis</text>
  <text x="750" y="335" font-size="13" fill="#57606a" text-anchor="middle">Vorlauf 45 °C, Rücklauf 35 °C</text>
  <text x="750" y="354" font-size="13" fill="#57606a" text-anchor="middle">bekommt, was der</text>
  <text x="750" y="371" font-size="13" fill="#57606a" text-anchor="middle">Prozess übrig lässt</text>
  <path d="M510,240 L575,240 L575,310 L640,310" fill="none" stroke="#c56a1a" stroke-width="2.5" marker-end="url(#pfeil-1)"/>
  <path d="M640,375 L510,375" fill="none" stroke="#57606a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#pfeil-2)"/>
  <circle cx="290" cy="290" r="11" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="290" y="295" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">2</text>
  <rect x="20" y="420" width="860" height="180" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="48" cy="443" r="11" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="48" y="448" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">1</text>
  <text x="70" y="448" font-size="14" fill="#1f2328" text-anchor="start">Beide Erzeuger laden denselben Puffer. Die Ladepriorität legt fest, wer zuerst lädt:</text>
  <text x="70" y="470" font-size="14" fill="#1f2328" text-anchor="start">die Wärmepumpe mit der günstigeren Wärme, danach der Kessel mit dem, was noch fehlt.</text>
  <circle cx="48" cy="493" r="11" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="48" y="498" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">2</text>
  <text x="70" y="498" font-size="14" fill="#1f2328" text-anchor="start">Nur mit einem gemeinsamen Ladeziel hat die Reihenfolge eine Wirkung. Lädt jeder Erzeuger</text>
  <text x="70" y="520" font-size="14" fill="#1f2328" text-anchor="start">seinen eigenen Speicher, gibt es zwischen ihnen nichts zu ordnen.</text>
  <circle cx="48" cy="543" r="11" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="48" y="548" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">3</text>
  <text x="70" y="548" font-size="14" fill="#1f2328" text-anchor="start">Der Puffer gibt an den Prozess nur Wärme ab, die den Prozessvorlauf hält. Braucht der Prozess</text>
  <text x="70" y="570" font-size="14" fill="#1f2328" text-anchor="start">mehr als den höchsten Vorlauf der Wärmepumpe, deckt ihn der Kessel.</text>
</svg>
