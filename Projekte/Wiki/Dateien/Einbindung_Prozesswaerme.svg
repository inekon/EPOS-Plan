<!--
Hydraulische Einbindung der Prozesswärme (Prinzipbild)

Inhalt: Ein Heizkessel (Vorlauf 90 °C) lädt mit Rang 1 seiner Wärmesenken einen geschichteten
Puffer mit der Nutzung Prozesswärme (2 000 l); Rang 2 ist der Heizkreis. Der Puffer versorgt
einen Prozess mit dem Temperaturpaar 80/60 °C. Eine Wärmepumpe (Vorlauf 55 °C) lädt einen
Heizungspuffer (1 000 l), der den Heizkreis 45/35 °C versorgt. Die Wärmepumpe erreicht den
Prozessvorlauf nicht und deckt den Prozess deshalb nicht.

Annahmen: Der Prozess läuft im Zweischichtbetrieb; Pumpen, Mischer, Übertrager und
Sicherheitstechnik sind weggelassen.

Darstellung: Vorlauf durchgezogen, Rücklauf gestrichelt, Pfeile in Fließrichtung, die
gepunktete graue Linie ist eine Verbindung, die nicht zustande kommt. Ziffern in Kreisen
verweisen auf die Erläuterung unten. Farben nach Vorlage:Diagrammfarbe (waerme, kessel,
speicher, netz). Prinzipbild mit gerundeten Beispielwerten, keinem Produkt zugeordnet.
-->
