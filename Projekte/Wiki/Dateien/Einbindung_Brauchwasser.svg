  <path d="M384,530 L418,530" fill="none" stroke="#1f9bb0" stroke-width="3" stroke-linejoin="round"/>
  <text x="426" y="534.5" font-size="13" fill="#57606a" text-anchor="start">Trinkwasser</text>
  <path d="M540,530 L574,530" fill="none" stroke="#1f9bb0" stroke-width="3" stroke-linejoin="round" stroke-dasharray="7 5"/>
  <text x="582" y="534.5" font-size="13" fill="#57606a" text-anchor="start">Zirkulation</text>
  <text x="40" y="568" font-size="13" fill="#57606a" text-anchor="start">1  Senke des Kessels: Puffer Kombi, Einspeisehöhe oben – er heizt nur den Bereitschaftsteil nach.</text>
  <text x="40" y="589" font-size="13" fill="#57606a" text-anchor="start">2  Senke der Wärmepumpe: Puffer Kombi, Einspeisehöhe Mitte – sie lädt die Heizungszonen bei niedrigem Vorlauf.</text>
  <text x="40" y="610" font-size="13" fill="#57606a" text-anchor="start">3  Das Frischwassermodul zapft nur, solange die oberste Zone Zapftemperatur + Grädigkeit hält.</text>
  <text x="40" y="631" font-size="13" fill="#57606a" text-anchor="start">4  Die Zirkulation ist eine eigene Teilreihe im Brauchwasserkanal und läuft auch ohne Zapfung.</text>
</svg>
