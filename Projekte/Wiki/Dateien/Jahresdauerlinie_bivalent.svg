<!--
Jahresdauerlinie der Heizleistung bei bivalent-parallelem Betrieb (Prinzipbild)

Inhalt: Die stündliche Heizleistung eines Jahres ist nach Größe sortiert aufgetragen, links
die kälteste Stunde, rechts die wärmste. Unter der Leistungsgrenze der Wärmepumpe liegt ihr
Anteil (Grundlast), darüber der Anteil des Kessels (Spitzenlast). Der Bivalenzpunkt ist der
Schnitt der Leistungsgrenze mit der Kurve: Links davon laufen beide Erzeuger, rechts davon
reicht die Wärmepumpe allein.

Modell der Kurve (kein Rechenergebnis von EPOS-Plan):
  Außentemperatur der t-ten Stunde, aufsteigend sortiert, als Normalverteilung:
    theta(t) = 10 °C + 7,5 K * z((t + 0,5) / 8760), z = Quantil der Standardnormalverteilung
  Heizleistung in Prozent der Heizlast, linear zwischen Heizgrenze und Normaußentemperatur:
    p(t) = (14 °C - theta(t)) / (14 °C - (−12 °C)), begrenzt auf 0 bis 100 Prozent
  Leistungsgrenze der Wärmepumpe vereinfacht konstant bei 55 Prozent der Heizlast; bei
  einer Luft-Wasser-Wärmepumpe sinkt die Leistung mit der Außentemperatur, die Grenze fiele
  dann nach links ab.
  Modellwerte: rund 1 800 Vollbenutzungsstunden, Heizbedarf in rund 6 200 Stunden,
  Bivalenzpunkt nach rund 740 Stunden, Anteil der Wärmepumpe an der Heizwärme rund 95
  Prozent. Die Achsen tragen keine Werte einer bestimmten Anlage.

Darstellung: Farben nach Vorlage:Diagrammfarbe (waerme für die Wärmepumpe, kessel für den
Kessel). Prinzipbild.
-->
