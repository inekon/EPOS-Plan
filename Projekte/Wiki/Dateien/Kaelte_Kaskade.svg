<?xml version="1.0" encoding="UTF-8"?>
<!--
Folge der Kälteerzeugung in einer Stunde und Kälteschranke auf Stufe AK3

Inhalt: Den Kältebedarf einer Stunde decken die Kälteerzeuger in fester Folge. Zuerst kühlen
Kältemaschinen mit Trocken- oder Nasskühler frei, wenn die Rückkühltemperatur tief genug ist.
Dann entladen die Kältespeicher. Dann decken die Wärmepumpen im Kühlbetrieb in der Reihenfolge
der Kaskade, jede zuerst über die freie Kühlung ihrer Wärmequelle (Sole), dann mit dem Verdichter.
Zuletzt decken die Kältemaschinen mit dem Verdichter in der Reihenfolge ihrer Anlagen. Ein Rest
bleibt ungedeckt. Auf der Stufe AK3 der Anlagenkopplung begrenzt die Summe der Stufen als
Kälteschranke die Raumkühlung; greift sie, wird der Raum wärmer. Auf den Stufen „aus“ und AK1
steht ungedeckte Kälte als Rest im Laufprotokoll.

Darstellung: Farben nach Vorlage:Diagrammfarbe (kaelte, umwelt, speicher). Prinzipbild ohne
Zahlenwerte, keinem Produkt zugeordnet.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<defs>
  <marker id="pk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#1f9bb0"/></marker>
  <marker id="pg" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#8c959f"/></marker>
</defs>
  <rect x="1" y="1" width="898" height="498" rx="12" fill="#fcfcfb" stroke="#d0d7de" stroke-width="1"/>
  <text x="28" y="38" font-size="18" fill="#1f2328" font-weight="600">Kälteerzeugung in einer Stunde: Folge und Kälteschranke</text>
  <text x="28" y="61" font-size="14" fill="#57606a">Jede Stufe deckt, was die vorige übrig lässt</text>

  <!-- Bedarf -->
  <rect x="30" y="200" width="160" height="80" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
  <text x="110" y="232" font-size="15" fill="#1f2328" font-weight="600" text-anchor="middle">Kältebedarf</text>
  <text x="110" y="254" font-size="13" fill="#57606a" text-anchor="middle">der Stunde: Raum</text>
  <text x="110" y="271" font-size="13" fill="#57606a" text-anchor="middle">und Prozess</text>
  <path d="M190,240 L215,240 L215,115 L233,115" fill="none" stroke="#1f9bb0" stroke-width="3" marker-end="url(#pk)"/>

  <!-- Stufen -->
  <rect x="240" y="85" width="360" height="60" rx="8" fill="#eef6f0" stroke="#3e8e4e" stroke-width="2"/>
  <text x="256" y="110" font-size="15" fill="#1f2328" font-weight="600">1  Freie Kühlung der Kältemaschinen</text>
  <text x="256" y="131" font-size="13" fill="#57606a">Trocken- oder Nasskühler, Rückkühler kalt genug</text>

  <rect x="240" y="170" width="360" height="60" rx="8" fill="#f3eef8" stroke="#7b4fa3" stroke-width="2"/>
  <text x="256" y="195" font-size="15" fill="#1f2328" font-weight="600">2  Kältespeicher entladen</text>
  <text x="256" y="216" font-size="13" fill="#57606a">Vorrat aus vorangegangenen Stunden</text>

  <rect x="240" y="255" width="360" height="60" rx="8" fill="#e8f5f8" stroke="#1f9bb0" stroke-width="2"/>
  <text x="256" y="280" font-size="15" fill="#1f2328" font-weight="600">3  Wärmepumpen im Kühlbetrieb</text>
  <text x="256" y="301" font-size="13" fill="#57606a">an Kühltagen: frei über die Sole, dann Verdichter</text>

  <rect x="240" y="340" width="360" height="60" rx="8" fill="#e8f5f8" stroke="#1f9bb0" stroke-width="2"/>
  <text x="256" y="365" font-size="15" fill="#1f2328" font-weight="600">4  Kältemaschinen mit Verdichter</text>
  <text x="256" y="386" font-size="13" fill="#57606a">in der Reihenfolge der Anlagen</text>

  <line x1="420" y1="145" x2="420" y2="163" stroke="#8c959f" stroke-width="2" marker-end="url(#pg)"/>
  <line x1="420" y1="230" x2="420" y2="248" stroke="#8c959f" stroke-width="2" marker-end="url(#pg)"/>
  <line x1="420" y1="315" x2="420" y2="333" stroke="#8c959f" stroke-width="2" marker-end="url(#pg)"/>
  <line x1="420" y1="400" x2="420" y2="423" stroke="#8c959f" stroke-width="2" marker-end="url(#pg)"/>
  <text x="430" y="160" font-size="12" fill="#57606a">Rest</text>
  <text x="430" y="245" font-size="12" fill="#57606a">Rest</text>
  <text x="430" y="330" font-size="12" fill="#57606a">Rest</text>

  <rect x="320" y="430" width="200" height="42" rx="8" fill="#f2f3f4" stroke="#8c959f" stroke-width="2"/>
  <text x="420" y="456" font-size="14" fill="#57606a" text-anchor="middle">ungedeckter Rest</text>

  <!-- Kälteschranke -->
  <path d="M612,90 L630,90 L630,395 L612,395" fill="none" stroke="#1f9bb0" stroke-width="2"/>
  <line x1="630" y1="242" x2="648" y2="242" stroke="#1f9bb0" stroke-width="2"/>
  <rect x="650" y="150" width="225" height="190" rx="8" fill="#ffffff" stroke="#1f9bb0" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="664" y="178" font-size="15" fill="#1f2328" font-weight="600">Kälteschranke (AK3)</text>
  <text x="664" y="203" font-size="13" fill="#57606a">Die Summe der Stufen 1 bis 4</text>
  <text x="664" y="222" font-size="13" fill="#57606a">am Kühlvorlauf, nach Abzug</text>
  <text x="664" y="241" font-size="13" fill="#57606a">der Prozesskälte, begrenzt</text>
  <text x="664" y="260" font-size="13" fill="#57606a">die Raumkühlung.</text>
  <text x="664" y="285" font-size="13" fill="#57606a">Greift sie, wird der Raum</text>
  <text x="664" y="304" font-size="13" fill="#57606a">wärmer.</text>
  <text x="664" y="326" font-size="11" fill="#57606a">Stufe aus oder AK1: Rest im Protokoll</text>

  <text x="870" y="480" font-size="13" fill="#57606a" text-anchor="end">Prinzipbild</text>
</svg>
