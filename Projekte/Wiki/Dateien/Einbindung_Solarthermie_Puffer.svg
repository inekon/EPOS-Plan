<?xml version="1.0" encoding="UTF-8"?>
<!--
Einbindung einer Solarthermieanlage in einen geschichteten Pufferspeicher

Inhalt: Das Kollektorfeld gibt seine Wärme über den Solarkreis (Solarstation mit Pumpe) an
einen Wärmetauscher unten im Pufferspeicher ab. Die Nachheizung (Kessel oder Wärmepumpe)
speist oben ein und hält nur den oberen Teil warm (Bereitschaftsteil). Warmwasserbereitung
und Heizung entnehmen oben und geben ihren Rücklauf unten zurück.

Annahmen: Der Speicher schichtet sauber, oben heiß und unten kalt; der Farbverlauf zeigt
diese Schichtung. Die Temperaturen oben rund 60 °C und unten rund 25 °C sind Beispielwerte.
Weil die Nachheizung ihren Rücklauf aus der Mitte holt, bleibt der untere Teil kalt und
kann Sonnenwärme aufnehmen; die Solarpumpe läuft nur, wenn das Kollektorfeld wärmer ist als
der Speicher unten.

Darstellung: Vorlauf durchgezogen, Rücklauf gestrichelt in derselben Farbe, Pfeile in
Fließrichtung. Farben nach Vorlage:Diagrammfarbe (solar, waerme, kessel, speicher).
Prinzipbild mit gerundeten Beispielwerten, keinem Produkt zugeordnet.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<defs>
  <linearGradient id="schichtung" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dba371"/><stop offset="0.3" stop-color="#e9c6a8"/><stop offset="0.6" stop-color="#f8ede4"/><stop offset="1" stop-color="#b3dde4"/></linearGradient>
  <marker id="pfeil-1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#b38600"/></marker>
  <marker id="pfeil-2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#c56a1a"/></marker>
</defs>
  <rect x="1" y="1" width="898" height="598" rx="12" fill="#fcfcfb" stroke="#d0d7de" stroke-width="1"/>
  <text x="28" y="38" font-size="18" fill="#1f2328" font-weight="600">Solarthermie mit geschichtetem Pufferspeicher</text>
