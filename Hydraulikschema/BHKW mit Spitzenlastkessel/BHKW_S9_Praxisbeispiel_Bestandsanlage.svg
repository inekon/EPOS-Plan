 fill="#222222">3</text><text x="630" y="512" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222">Vorlauf Gruppe</text><rect x="720" y="330" width="95" height="210" rx="47.5" ry="34" fill="#eef3f8" stroke="#222222" stroke-width="2.5"/><text x="767.5" y="431.0" font-size="15" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222" font-weight="bold">Wärme-</text><text x="767.5" y="451.0" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222">speicher</text><text x="767" y="505" font-size="11" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222">15 m³</text><rect x="840" y="330" width="95" height="210" rx="47.5" ry="34" fill="#eef3f8" stroke="#222222" stroke-width="2.5"/><text x="887.5" y="431.0" font-size="15" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222" font-weight="bold">Wärme-</text><text x="887.5" y="451.0" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222">speicher</text><text x="887" y="505" font-size="11" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222">15 m³</text><polyline points="767,280 767,330" fill="none" stroke="#c81e1e" stroke-width="3.5" stroke-linejoin="round"/><polyline points="887,280 887,330" fill="none" stroke="#c81e1e" stroke-width="3.5" stroke-linejoin="round"/><circle cx="767" cy="280" r="5" fill="#c81e1e"/><circle cx="887" cy="280" r="5" fill="#c81e1e"/><polyline points="767,540 767,620 1040,620" fill="none" stroke="#1d6fb8" stroke-width="3.5" stroke-linejoin="round"/><polyline points="887,540 887,620" fill="none" stroke="#1d6fb8" stroke-width="3.5" stroke-linejoin="round"/><circle cx="887" cy="620" r="5" fill="#1d6fb8"/><circle cx="1040" cy="620" r="5" fill="#1d6fb8"/><circle cx="120" cy="380" r="16" fill="white" stroke="#222222" stroke-width="1.5"/><text x="120" y="378" font-size="9" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222">TIC</text><text x="120" y="389" font-size="9" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222">Sp1</text><text x="120" y="414" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222">Speicher oben &lt;70 °C</text><text x="120" y="428" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222">(leer) → BHKW EIN</text><circle cx="120" cy="480" r="16" fill="white" stroke="#222222" stroke-width="1.5"/><text x="120" y="478" font-size="9" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222">TIC</text><text x="120" y="489" font-size="9" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222">Sp8</text><text x="120" y="514" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222">Speicher unten 90 °C</text><text x="120" y="528" font-size="10" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222">(voll) → BHKW AUS</text><polyline points="1180,180 1180,350" fill="none" stroke="#c81e1e" stroke-width="3.5" stroke-linejoin="round"/><polyline points="1180,250 1230,250" fill="none" stroke="#c81e1e" stroke-width="3.5" stroke-linejoin="round"/><polyline points="1180,350 1230,350" fill="none" stroke="#c81e1e" stroke-width="3.5" stroke-linejoin="round"/><circle cx="1180" cy="250" r="5" fill="#c81e1e"/><g transform="translate(1205,250) rotate(0)"><circle r="14" fill="white" stroke="#222222" stroke-width="2"/><polygon points="-7,-8 -7,8 9,0" fill="#222222"/></g><text x="1205" y="228" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222">P5</text><g transform="translate(1205,350) rotate(0)"><circle r="14" fill="white" stroke="#222222" stroke-width="2"/><polygon points="-7,-8 -7,8 9,0" fill="#222222"/></g><text x="1205" y="328" font-size="12" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222">P6</text><rect x="1230" y="222" width="150" height="56" rx="6" fill="#eef7ee" stroke="#222222" stroke-width="2"/><text x="1305.0" y="246" font-size="13" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222" font-weight="bold">Verbraucher Ost</text><text x="1305.0" y="266" font-size="10.5" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222">(Heizgruppe)</text><rect x="1230" y="322" width="150" height="56" rx="6" fill="#eef7ee" stroke="#222222" stroke-width="2"/><text x="1305.0" y="346" font-size="13" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222" font-weight="bold">Verbraucher West</text><text x="1305.0" y="366" font-size="10.5" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222">(Heizgruppe)</text><polyline points="1380,260 1430,260 1430,760" fill="none" stroke="#1d6fb8" stroke-width="3.5" stroke-linejoin="round"/><polyline points="1380,360 1430,360" fill="none" stroke="#1d6fb8" stroke-width="3.5" stroke-linejoin="round"/><circle cx="1430" cy="360" r="5" fill="#1d6fb8"/><g transform="translate(1430,560) rotate(90)"><polygon points="0,-6 12,0 0,6" fill="#1d6fb8"/></g><rect x="6" y="6" width="1488" height="938" fill="none" stroke="#222222" stroke-width="2"/><text x="750.0" y="40" font-size="22" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222" font-weight="bold">BHKW-Schema 9 – Praxisbeispiel: BHKW-Nachrüstung in einer Bestandsanlage</text><text x="750.0" y="64" font-size="14" text-anchor="middle" font-family="Arial, sans-serif" fill="#222222">Nachträgliche Einbindung von BHKW und Wärmespeichern über einen Einbauverteiler in den Gesamtrücklauf einer Bestandsanlage mit zwei Heizkesseln (ASUE-Praxisbeispiel)</text><rect x="1160" y="768" width="250" height="112" fill="white" stroke="#222222" stroke-width="1.5"/><text x="1172" y="790" font-size="14" text-anchor="start" font-family="Arial, sans-serif" fill="#222222" font-weight="bold">Legende</text><line x1="1172" y1="812" x2="1212" y2="812" stroke="#c81e1e" stroke-width="3.5"/><text x="1222" y="816" font-size="12" text-anchor="start" font-family="Arial, sans-serif" fill="#222222">Vorlauf</text><line x1="1172" y1="836" x2="1212" y2="836" stroke="#1d6fb8" stroke-width="3.5"/><text x="1222" y="840" font-size="12" text-anchor="start" font-family="Arial, sans-serif" fill="#222222">Rücklauf</text><line x1="1172" y1="860" x2="1212" y2="860" stroke="#e8862a" stroke-width="3.5" stroke-dasharray="10,7"/><text x="1222" y="864" font-size="12" text-anchor="start" font-family="Arial, sans-serif" fill="#222222">Sommer-Bypass</text><text x="60" y="880" font-size="12" text-anchor="start" font-family="Arial, sans-serif" fill="#222222">P1 = BHKW-Pumpe · P K1/K2 = Kesselpumpen · P5/P6 = Verbraucherpumpen · M = Motorklappe/-ventil · TIC = Temperatur-Messung/-Regelung · SV = Sicherheitsventil · MAG/Nachspeisung nicht dargestellt</text><text x="60" y="902" font-size="12" text-anchor="start" font-family="Arial, sans-serif" fill="#222222">Speicher leer (TIC Sp1 &lt; 70 °C) → BHKW EIN · Speicher voll (TIC Sp8 = 90 °C) → BHKW AUS · Kesselfreigabe erst nach Speicherentladung · Sommer: Motorklappe offen, Kessel gesperrt</text><text x="1440" y="930" font-size="10" text-anchor="end" font-family="Arial, sans-serif" fill="#222222">Erstellt für Software Wärmeplan · Schemadarstellung, keine Ausführungsplanung</text></svg>