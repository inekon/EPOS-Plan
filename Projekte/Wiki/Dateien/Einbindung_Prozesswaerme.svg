  <text x="400" y="292" font-size="12" fill="#57606a" text-anchor="middle">erreicht 80 °C nicht</text>
  <circle cx="560" cy="324" r="11" fill="#fcfcfb" stroke="#57606a" stroke-width="1.6"/>
  <text x="560" y="328.5" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">4</text>
  <path d="M40,520 L74,520" fill="none" stroke="#c56a1a" stroke-width="3" stroke-linejoin="round"/>
  <text x="82" y="524.5" font-size="13" fill="#57606a" text-anchor="start">Vorlauf</text>
  <path d="M164,520 L198,520" fill="none" stroke="#c56a1a" stroke-width="3" stroke-linejoin="round" stroke-dasharray="7 5"/>
  <text x="206" y="524.5" font-size="13" fill="#57606a" text-anchor="start">Rücklauf</text>
  <text x="40" y="556" font-size="13" fill="#57606a" text-anchor="start">1  Die Senkenliste des Kessels beliefert zuerst den Prozesspuffer, den Rest der Stunde der Heizkreis.</text>
  <text x="40" y="577" font-size="13" fill="#57606a" text-anchor="start">2  Mit Temperaturpaar zählt je Stunde der höchste geforderte Vorlauf des Prozesskanals.</text>
  <text x="40" y="598" font-size="13" fill="#57606a" text-anchor="start">3  Ein geschichteter Speicher gibt an den Prozess nur aus Schichten ab, die diesen Vorlauf halten.</text>
  <text x="40" y="619" font-size="13" fill="#57606a" text-anchor="start">4  Wer den Prozessvorlauf nicht erreicht, deckt den Prozesskanal in dieser Stunde nicht.</text>
