<?xml version="1.0" encoding="UTF-8"?>
<!--
Kälteanlage mit Kältemaschine, Trocken-Rückkühler, Kältespeicher und eigenem Zähler (Beispielanlage K)

Inhalt: Kältemaschine 1 (100 kW) erzeugt Kaltwasser. Ihre Abwärme geht über einen
Trocken-Rückkühler an die Außenluft; ist die Außenluft kalt genug, kühlt der Rückkühler das
Kaltwasser frei, der Verdichter steht. Ein Kältespeicher (2 000 l, 6/12 °C) nimmt Kälte auf,
die über den Raumbedarf hinaus erzeugt wird, und gibt sie später ab. Im Gebäude geben Kühldecken
(16/19 °C) die Kälte an den Raum. Der Kältestrom kommt aus dem Netz über einen eigenen Zähler mit
eigenem Stromträger; Photovoltaik und Stromspeicher decken ihn dann nicht mit.

Darstellung: Vorlauf durchgezogen, Rücklauf gestrichelt in derselben Farbe, Pfeile in
Fließrichtung. Farben nach Vorlage:Diagrammfarbe (kaelte, waerme für Abwärme, umwelt, speicher,
strom). Prinzipbild mit gerundeten Beispielwerten, keinem Produkt zugeordnet.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<defs>
  <marker id="pk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#1f9bb0"/></marker>
  <marker id="pw" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#c56a1a"/></marker>
  <marker id="ps" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#2f74b5"/></marker>
  <marker id="pu" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,1 L10,5 L0,9 Z" fill="#3e8e4e"/></marker>
</defs>
  <rect x="1" y="1" width="898" height="518" rx="12" fill="#fcfcfb" stroke="#d0d7de" stroke-width="1"/>
  <text x="28" y="38" font-size="18" fill="#1f2328" font-weight="600">Kälteanlage: Kältemaschine, Rückkühler, Kältespeicher, Kühlübergabe</text>
  <text x="28" y="61" font-size="14" fill="#57606a">Beispielanlage K: Bürogebäude, Kühllast 90 kW, Kühldecken 16/19 °C</text>

  <!-- Rückkühler -->
  <rect x="40" y="95" width="200" height="70" rx="8" fill="#eef6f0" stroke="#3e8e4e" stroke-width="2"/>
  <text x="140" y="124" font-size="15" fill="#1f2328" font-weight="600" text-anchor="middle">Trocken-Rückkühler</text>
  <text x="140" y="146" font-size="13" fill="#57606a" text-anchor="middle">kalte Außenluft: freie Kühlung</text>
  <line x1="240" y1="130" x2="310" y2="130" stroke="#3e8e4e" stroke-width="3" marker-end="url(#pu)"/>
  <text x="318" y="135" font-size="14" fill="#3e8e4e">Außenluft</text>

  <!-- Abwärme -->
  <line x1="140" y1="240" x2="140" y2="172" stroke="#c56a1a" stroke-width="3" marker-end="url(#pw)"/>
  <text x="150" y="210" font-size="13" fill="#c56a1a">Abwärme</text>

  <!-- Kältemaschine -->
  <rect x="40" y="240" width="200" height="90" rx="8" fill="#e8f5f8" stroke="#1f9bb0" stroke-width="2"/>
  <text x="140" y="272" font-size="15" fill="#1f2328" font-weight="600" text-anchor="middle">Kältemaschine 1</text>
  <text x="140" y="294" font-size="13" fill="#57606a" text-anchor="middle">100 kW, Kennlinie mit EER</text>
  <text x="140" y="314" font-size="13" fill="#57606a" text-anchor="middle">Teillast und Takten</text>

  <!-- Kältespeicher -->
  <rect x="345" y="225" width="170" height="120" rx="8" fill="#f3eef8" stroke="#7b4fa3" stroke-width="2"/>
  <text x="430" y="257" font-size="15" fill="#1f2328" font-weight="600" text-anchor="middle">Kältespeicher</text>
  <text x="430" y="279" font-size="13" fill="#57606a" text-anchor="middle">Speicher 2, 2 000 l</text>
  <text x="430" y="299" font-size="13" fill="#57606a" text-anchor="middle">6/12 °C, rund 14 kWh</text>
  <text x="430" y="319" font-size="13" fill="#57606a" text-anchor="middle">lädt nur an Kühltagen</text>

  <!-- Kaltwasser Vorlauf und Rücklauf -->
  <line x1="240" y1="262" x2="338" y2="262" stroke="#1f9bb0" stroke-width="3" marker-end="url(#pk)"/>
  <line x1="515" y1="262" x2="633" y2="262" stroke="#1f9bb0" stroke-width="3" marker-end="url(#pk)"/>
  <text x="574" y="252" font-size="13" fill="#1f9bb0" text-anchor="middle">Vorlauf</text>
  <line x1="640" y1="308" x2="522" y2="308" stroke="#1f9bb0" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#pk)"/>
  <line x1="345" y1="308" x2="247" y2="308" stroke="#1f9bb0" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#pk)"/>
  <text x="574" y="328" font-size="13" fill="#1f9bb0" text-anchor="middle">Rücklauf</text>

  <!-- Gebäude -->
  <path d="M610,175 L740,110 L870,175 L870,400 L610,400 Z" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
  <text x="740" y="200" font-size="15" fill="#1f2328" font-weight="600" text-anchor="middle">Gebäude</text>
  <text x="740" y="222" font-size="13" fill="#57606a" text-anchor="middle">Raum 26 °C</text>
  <rect x="640" y="245" width="200" height="80" rx="6" fill="#e8f5f8" stroke="#1f9bb0" stroke-width="2"/>
  <text x="740" y="276" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Kühlübergabe</text>
  <text x="740" y="298" font-size="13" fill="#57606a" text-anchor="middle">Kühldecken 16/19 °C</text>
  <text x="740" y="365" font-size="13" fill="#57606a" text-anchor="middle">reicht die Kälte nicht,</text>
  <text x="740" y="383" font-size="13" fill="#57606a" text-anchor="middle">wird der Raum wärmer</text>

  <!-- Strom -->
  <rect x="30" y="405" width="90" height="56" rx="8" fill="#eef3fa" stroke="#2f74b5" stroke-width="2"/>
  <text x="75" y="438" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Netz</text>
  <line x1="120" y1="433" x2="153" y2="433" stroke="#2f74b5" stroke-width="3" marker-end="url(#ps)"/>
  <rect x="160" y="405" width="150" height="56" rx="8" fill="#eef3fa" stroke="#2f74b5" stroke-width="2"/>
  <text x="235" y="429" font-size="14" fill="#1f2328" font-weight="600" text-anchor="middle">Eigener Zähler</text>
  <text x="235" y="449" font-size="13" fill="#57606a" text-anchor="middle">Kühlträger</text>
  <line x1="200" y1="405" x2="200" y2="337" stroke="#2f74b5" stroke-width="3" marker-end="url(#ps)"/>
  <text x="208" y="378" font-size="13" fill="#2f74b5">Kältestrom</text>
  <text x="345" y="425" font-size="13" fill="#57606a">Mit eigenem Zähler decken Photovoltaik, BHKW und Stromspeicher</text>
  <text x="345" y="444" font-size="13" fill="#57606a">den Kältestrom nicht; er trägt Tarif, Grund- und Leistungspreis</text>
  <text x="345" y="463" font-size="13" fill="#57606a">des gewählten Stromträgers.</text>

  <!-- Legende -->
  <line x1="30" y1="495" x2="70" y2="495" stroke="#1f9bb0" stroke-width="3"/>
  <text x="78" y="500" font-size="13" fill="#57606a">Kaltwasser-Vorlauf</text>
  <line x1="215" y1="495" x2="255" y2="495" stroke="#1f9bb0" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="263" y="500" font-size="13" fill="#57606a">Rücklauf</text>
  <line x1="350" y1="495" x2="390" y2="495" stroke="#c56a1a" stroke-width="3"/>
  <text x="398" y="500" font-size="13" fill="#57606a">Abwärme</text>
  <line x1="485" y1="495" x2="525" y2="495" stroke="#2f74b5" stroke-width="3"/>
  <text x="533" y="500" font-size="13" fill="#57606a">Strom</text>
  <text x="870" y="500" font-size="13" fill="#57606a" text-anchor="end">Prinzipbild, Beispielwerte gerundet</text>
</svg>
