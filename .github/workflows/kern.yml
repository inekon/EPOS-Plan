# Kern-Lauf: baut und testet die Projekte ohne Windowsbindung (KiKern,
# KiKern.Tests, SpeicherEngine, SpeicherEngine.Tests, seit iU3 EPOS.Kern und
# seit iU4 EPOS.Kern.Tests, dazu EPOS.UI und EPOS.UI.Tests, seit dem
# Stromspeicher-Sync vom 11.09.2026 SpeicherPlanung und SpeicherPlanung.Tests).
# Ausgewaehlt werden sie ueber den Solution-Filter WP-Plan.Kern.slnf; die
# WinForms-App und das alte Referenzlauf-Werkzeug bleiben damit aussen vor.
# Dazu kommen drei Laeufe, die NICHT im Filter stehen: der Referenzlauf (iU3)
# und seit iU7-7 die ChartProben - beides ausfuehrbare Programme statt
# Testprojekte, die belegen, dass Rechenkern und Diagramm-Renderer ohne Windows
# arbeiten - sowie seit iU8-12 die Tests des Formularkarten-Werkzeugs, das eine
# eigene Projektmappe hat und deshalb im Filter nicht auftaucht (nur ubuntu).
#
# Zweck (Umsetzungskonzept iOS, Paket iU1): fruehzeitig belegen, dass der Kern
# plattformfrei bleibt. Bricht ein Kernprojekt die Portierbarkeit, faellt das
# hier auf, nicht erst beim iOS-Bau.
name: Kern

# Anwenderregel (03.09.2026): Der macOS-Laeufer zaehlt zehnfach auf das Actions-
# Kontingent und laeuft deshalb NICHT bei jedem Push, sondern nur auf Abruf
# (Actions -> Kern -> Run workflow -> "macos" ankreuzen) - und nur nach Rueckfrage
# beim Anwender. Push und Pull Request pruefen auf ubuntu.
# Entkopplung (Anwenderentscheid 12.09.2026, "CI-Laeufe entkoppeln"): Der Sync stoesst
# oft mehrere Pushes binnen Minuten an; nur der letzte Stand zaehlt. Ein neuer Lauf
# desselben Zweigs bricht den ueberholten ab. Dazu loesen Aenderungen, die kein Test
# liest (Wiki-Quellen, Mockups, Fremdquellen, Lizenzserver-Plugin), keinen Lauf aus -
# Dokumentation/ und die CLAUDE.md bleiben Ausloeser, weil die Wachen sie pruefen.
concurrency:
  group: kern-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths-ignore:
      - 'Projekte/Wiki/**'
      - 'Dokumentation/aktuell/Mockups/**'
      - 'Quellen/**'
      - 'Lizenzserver/**'
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: 'Zusaetzlich auf macos-latest bauen und testen (zehnfaches Kontingent)'
        type: boolean
        default: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  build-test:
    # fail-fast aus: schlaegt ubuntu fehl, soll macos trotzdem zu Ende laufen -
    # nur so wird sichtbar, ob ein Fehler plattformabhaengig ist.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && inputs.macos && fromJSON('["ubuntu-latest","macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      # OHNE "lfs: true" - das ist Absicht (Auftrag #243, Anwenderentscheid AUF-Q2 vom
      # 12.09.2026). Seit #243 liegen 69 Dateien in Git LFS: die Testdatenbank
      # (rund 68 MB) und die 68 VDI-3805-Archive (rund 97 MB). "lfs: true" zoege bei
      # JEDEM Lauf alle 165 MB und ginge voll auf das LFS-Bandbreitenkontingent des
      # Kontos. Dieser Lauf braucht davon genau EINE Datei; sie wird unten gezielt
      # geholt.
      - uses: actions/checkout@v4

      # Das LFS-Zwischenlager haengt am Hash des ZEIGERS - der aendert sich genau
      # dann, wenn sich die Testdatenbank aendert. Ein Treffer spart den Download
      # vollstaendig.
      - name: LFS-Zwischenlager
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-testdb-${{ hashFiles('Referenzlaeufe/Kenndaten_Test.sqlite') }}

      # Gezielt: nur die Testdatenbank, nicht die 68 Herstellerarchive. Danach die
      # Probe aufs Exempel - ohne sie schluege ein liegengebliebener Zeiger erst
      # weit unten als "file is not a database" auf, und niemand faende den Grund.
      # Die Laeufer (ubuntu, macos) bringen git-lfs mit; ein Installationsschritt
      # ist nicht noetig.
      - name: Testdatenbank aus LFS
        run: |
          git lfs pull --include="Referenzlaeufe/Kenndaten_Test.sqlite" --exclude=""
          datei=Referenzlaeufe/Kenndaten_Test.sqlite
          groesse=$(wc -c < "$datei" | tr -d ' ')
          kopf=$(head -c 40 "$datei")
          case "$kopf" in
            "version https://git-lfs"*)
              echo "FEHLER: $datei ist ein Git-LFS-Zeiger ($groesse Byte) statt der Datenbank."
              echo "Abhilfe: einmal je Rechner 'git lfs install', danach"
              echo "         git lfs pull --include=Referenzlaeufe/Kenndaten_Test.sqlite"
              exit 1
              ;;
          esac
          if [ "$groesse" -lt 1000000 ]; then
            echo "FEHLER: $datei ist mit $groesse Byte zu klein - der LFS-Abruf ist nicht durchgekommen."
            exit 1
          fi
          echo "Testdatenbank aus LFS: $groesse Byte"

      # Die SDK-Fassung kommt aus global.json (10.0.400), damit CI und
      # Arbeitsplatz nicht auseinanderlaufen.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Bauen
        run: dotnet build WP-Plan.Kern.slnf -c Release

      # 11.09.2026 (Stromspeicher-Sync): Der Filter fuehrt seither ZEHN Projekte,
      # darunter SpeicherPlanung und SpeicherPlanung.Tests - ein eigener Schritt
      # ist nicht noetig, der Bau- und der Testschritt nehmen sie ueber den
      # Filter mit.
      # DAMIT IST DER OR-TOOLS-NACHWEIS AUF UBUNTU GEFUEHRT: Google.OrTools
      # (9.15.6755, SCIP) haengt ausschliesslich an SpeicherPlanung, und dieser
      # Lauf belegt, dass das Paket samt seiner nativen Haelfte auf Linux
      # wiederhergestellt wird, baut und die MILP-Faelle rechnet. Der Planer ist
      # also NICHT windowsgebunden - windowsgebunden ist nur, WER IHN REGISTRIERT
      # (WindowsFormsApplication1/Program.cs setzt
      # SpeicherFlottenProjektCtrl.PlanerFactory; EPOS.Kern, EPOS.UI,
      # SpeicherEngine und EPOS.iOS kennen nur die Schnittstelle IFlottenPlaner).
      # EIN Fall laeuft hier bewusst NICHT mit: der Oracle-Jahresbenchmark ueber
      # 35 040 Viertelstunden in SpeicherPlanung.Tests/FlottenIntegrationTests.cs
      # steht auf [Fact(Skip = ...)], weil er das 60-Sekunden-Limit reisst. Die
      # kurze Vierwochen-Fassung desselben Wegs laeuft mit; wer die Jahreszahl
      # braucht, nimmt den Skip von Hand heraus. "27 bestanden, 1 uebersprungen"
      # ist deshalb das erwartete Ergebnis dieses Projekts und kein Ausfall.
      #
      # Sammlungen laufen seit #231 (12.09.2026) NICHT parallel (Kulturpinnung ueber
      # 50 Testklassen, Befund Windows-Lauf 319/320) - hier invariant und deshalb ohne
      # eigene Wirkung, der Schalter steht nur zur Gleichheit mit windows.yml und dem
      # Gate. Die Testdatenbank-Sammlung laeuft ohnehin schon seriell (#106).
      - name: Testen
        run: dotnet test WP-Plan.Kern.slnf -c Release --no-build -- xUnit.ParallelizeTestCollections=false xUnit.MaxParallelThreads=2

      # iU8-12: Das Formularkarten-Werkzeug hat eine EIGENE Projektmappe und
      # steht deshalb weder in WP-Plan.sln noch im Solution-Filter - der
      # Test-Schritt oben sieht es nicht. Es ist die Abnahmecheckliste von iU9
      # (Feldkarte je Maske), und eine stumpfe Checkliste faellt niemandem auf.
      # Seine Tests zerfallen seit iU8-12e in zwei Arten: Werkzeugtests lesen
      # eingefrorene Pruefmuster, Bestandstests (StapelTests) lesen die echten
      # Designer-Dateien. Die zweite Art faellt absichtlich rot aus, sobald eine
      # Maske umgestellt wird, ohne dass jemand den Stapellauf nachzieht.
      # NUR ubuntu: Das Werkzeug ist plattformfrei, ein zweiter Lauf auf macOS
      # brauchte Minutenkontingent (Faktor 10) und wuerde nichts Neues zeigen.
      - name: Formularkarte-Tests
        if: matrix.os == 'ubuntu-latest'
        run: dotnet test Werkzeuge/Formularkarte/Formularkarte.sln -c Release

      # Auftrag #160: Auch das Werkzeug, das den AUSLIEFERUNGSSTAND der Datenbank
      # erzeugt, hat eine eigene Projektmappe und steht nicht in WP-Plan.sln.
      # Es haengt an zwei Dingen, die sich weiterbewegen: am SCHEMA (es leitet
      # seine Tabellenliste daraus ab - ein neuer Schemaschritt mit Projektbezug
      # muss von selbst erfasst werden) und am Projekttransfer
      # (ProjektExportImportCtrl spielt die Beispiele ein). Faellt eines von
      # beiden aus, liefe die naechste Freigabe mit einer halben Vorlage - und
      # das faellt erst beim Kunden auf. Die Proben starten das Werkzeug als
      # PROGRAMM gegen eine Kopie der Testdatenbank; ohne diese Datei
      # ueberspringen sie still.
      # NUR ubuntu: plattformfrei, ein zweiter Lauf auf macOS zeigte nichts Neues
      # und kostet Minutenkontingent (Faktor 10).
      - name: Auslieferungsvorlage-Tests
        if: matrix.os == 'ubuntu-latest'
        run: dotnet test Werkzeuge/Auslieferungsvorlage/Auslieferungsvorlage.sln -c Release

      # Gebaeudesimulation, Abloesekriterium Q24/E27 Bedingung (1): Das Werkzeug, das
      # Tagesbilanz- und VDI-6007-Weg an den Bestandsprojekten vergleicht, hat eine eigene
      # Projektmappe und steht nicht in WP-Plan.sln. Seine Proben halten die Zahlen gegen
      # die Referenzbasis (T1/T2/T4) - ein Rechenwegwechsel ohne neue Basis faellt hier
      # auf - und pruefen Schreibort, Schreibsperre und Namensbereinigung. Sie starten das
      # Werkzeug als PROGRAMM gegen Kopien der Testdatenbank; ohne diese Datei schweigen
      # sie. Faellt mit Stufe GA (Loeschliste 6.1).
      # NUR ubuntu: plattformfrei, ein zweiter Lauf auf macOS zeigte nichts Neues.
      - name: Gebaeudevergleich-Tests
        if: matrix.os == 'ubuntu-latest'
        run: dotnet test Werkzeuge/Gebaeudevergleich/Gebaeudevergleich.sln -c Release

      # Zapfprofilgenerator, Stufe Z5 / offener Punkt K5: Das Werkzeug, das den Generator
      # gegen GEMESSENE Reihen haelt, hat eine eigene Projektmappe und steht nicht in
      # WP-Plan.sln. Seine Proben laufen gegen das mitgelieferte Beispiel - einen
      # erfundenen Katalog und eine synthetische Reihe, die aus derselben Rechnung stammt -
      # und pruefen Katalogleser, Ablauf, Ampel und vor allem die BERICHTSWACHE, die
      # Absolutwerte der Messung aus jedem Bericht haelt. Echte Messreihen liegen beim
      # Anwender und nie im Repositorium; der Fall gegen
      # Referenzlaeufe/Messreihen_INEKON schweigt hier deshalb immer.
      # NUR ubuntu: plattformfrei, ein zweiter Lauf auf macOS zeigt nichts Neues.
      - name: ZapfprofilValidierung-Tests
        if: matrix.os == 'ubuntu-latest'
        run: dotnet test Werkzeuge/ZapfprofilValidierung/ZapfprofilValidierung.sln -c Release

      # 03.09.2026: SQL-Dialekt-Audit. Der Referenzlauf weiter unten deckt den
      # RECHENWEG ab - Dialog- und Pflegepfade nicht. Genau dort sassen zwei
      # Access-Altlasten, die erst Wochen nach dem Cutover beim Anwender
      # auffielen: "id_ENERGIETRÄGER" gegen die Spalte "ID_Energieträger"
      # (c288e1c; SQLite faltet Gross/Klein nur bei ASCII) und ein
      # "UPDATE ... INNER JOIN ... SET" in Access-Schreibweise (dd4113f).
      # Der Pruefer haelt JEDEN SQL-Text des Bestands mit EXPLAIN gegen die
      # Testdatenbank und gegen die Verbotsliste aus Dokumentation/aktuell/BETRIEB_SQLITE.md 6.2;
      # er endet mit 1, sobald eine Fundstelle bleibt.
      # NUR ubuntu: reines Python, plattformfrei - ein zweiter Lauf auf macOS
      # zeigte nichts Neues und kostet Minutenkontingent (Faktor 10).
      # Der Selbsttest laeuft immer, auch ohne Testdatenbank: er belegt, dass
      # die Regeln greifen - ein Pruefer, der nichts findet, ist erst dann eine
      # gute Nachricht, wenn er etwas finden WUERDE.
      - name: SQL-Dialekt gegen SQLite
        if: matrix.os == 'ubuntu-latest' && hashFiles('Referenzlaeufe/Kenndaten_Test.sqlite') != ''
        run: |
          python3 Werkzeuge/SqlDialektPruefer/pruefer.py --db Referenzlaeufe/Kenndaten_Test.sqlite --selbsttest
          python3 Werkzeuge/SqlDialektPruefer/pruefer.py --db Referenzlaeufe/Kenndaten_Test.sqlite

      # iU7-7: Der Renderer des Berichts liegt seit iU7-5 im Kern. Die Probe
      # zeichnet jedes Diagrammbild aus synthetischen Reihen und prueft je Bild
      # PNG-Signatur, Bildmasse, Farbvorkommen und Determinismus - ohne
      # Datenbank, ohne Oberflaeche. Sie faellt rot aus, sobald der Renderer
      # eine Windows-API braucht ODER sich das Bild aendert. Eigene .sln,
      # deshalb nicht im Solution-Filter; gebaut wird sie vom dotnet run.
      # Auf ubuntu schreibt sie mit --hashes zusaetzlich die Hashliste ALLER
      # Bilder (auch der Gegen- und Versatzproben) fuer den naechsten Schritt.
      - name: ChartProben (Renderer plattformfrei)
        id: chartproben
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            dotnet run --project Proben/ChartProben -c Release -- --hashes artifacts/chartproben-hashliste/hashliste.sha256
          else
            dotnet run --project Proben/ChartProben -c Release
          fi

      # Die Hash-Messlatte (Proben/ChartProben/LIESMICH.md, "Die Hash-Messlatte"):
      # JEDE Zeile der juengsten Proben/ChartProben/Messlatte_*.sha256 muss
      # unveraendert in der Hashliste des Laufs stehen. Eine geaenderte oder
      # fehlende Zeile macht den Schritt rot und nennt die Bilder; zusaetzliche
      # Zeilen sind neue Proben - sie werden gezaehlt und sind erlaubt. Der
      # Schritt laeuft auch, wenn die Probe selbst rot ist: Dann nennt er, welche
      # Bilder sich geaendert haben.
      # NUR ubuntu: Die Messlatte ist auf dem Linux-Laeufer eingefroren. Die
      # Systemschriften gehen in jedes Bild ein; auf macOS wiche jeder Hash ab.
      - name: ChartProben-Messlatte (nur ubuntu)
        if: matrix.os == 'ubuntu-latest' && (success() || steps.chartproben.outcome == 'failure')
        run: |
          liste=artifacts/chartproben-hashliste/hashliste.sha256
          messlatte=$(ls Proben/ChartProben/Messlatte_*.sha256 2>/dev/null | sort | tail -n 1)
          if [ -z "$messlatte" ]; then
            echo "::error::Keine Messlatte Proben/ChartProben/Messlatte_*.sha256 gefunden."
            exit 1
          fi
          if [ ! -s "$liste" ]; then
            echo "::error::Die Probe hat keine Hashliste geschrieben ($liste)."
            exit 1
          fi
          echo "Messlatte: $messlatte"
          echo "Hashliste: $liste (Laeuferabbild ${ImageOS:-?} ${ImageVersion:-?})"
          awk -v messlatte="$(basename "$messlatte")" '
            function abweichung(art, bild, text) {
              print art bild text
              aus++
              if (aus <= 10) betroffen = betroffen (aus > 1 ? ", " : "") bild
              else if (aus == 11) betroffen = betroffen ", ..."
            }
            FNR == NR  { if (NF) { lauf[$0] = 1; hash[$2] = $1; name[++n] = $2 }; next }
            NF == 0    { next }
                       { zeilen++; alt[$2] = 1 }
            $0 in lauf { gleich++; next }
            $2 in hash { abweichung("GEAENDERT: ", $2, "  Messlatte " $1 "  Lauf " hash[$2]); next }
                       { abweichung("FEHLT:     ", $2, "  Messlatte " $1 "  - im Lauf nicht gezeichnet") }
            END {
              for (i = 1; i <= n; i++) if (!(name[i] in alt)) { print "NEU:       " name[i]; neu++ }
              printf "%s: %d von %d Zeilen unveraendert, %d geaendert oder fehlend, %d neue Bilder ohne Messlattenzeile.\n", messlatte, gleich, zeilen, aus, neu
              if (zeilen == 0) { print "::error::Die Messlatte " messlatte " ist leer."; exit 1 }
              if (aus > 0) { print "::error::ChartProben-Messlatte: " aus " von " zeilen " Zeilen geaendert oder fehlend: " betroffen; exit 1 }
              if (neu > 0) print "::notice::" neu " neue ChartProben-Bilder ohne Messlattenzeile - die Messlatte aus dem Artefakt chartproben-hashliste-ubuntu-latest nachziehen."
            }
          ' "$liste" "$messlatte"

      # Die Bilder selbst als Artefakt - bei einer Abweichung will man sie
      # ansehen und nicht nur die Byte-Zahl lesen.
      - name: ChartProben-Bilder als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chartproben-${{ matrix.os }}
          path: artifacts/chartproben
          retention-days: 14

      # Die Hashliste des Laufs als Artefakt, auch bei Rot: Ein bewusstes
      # Neueinfrieren oder Nachziehen der Messlatte uebernimmt sie von hier.
      - name: ChartProben-Hashliste als Artefakt
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: chartproben-hashliste-${{ matrix.os }}
          path: artifacts/chartproben-hashliste
          retention-days: 14

      # iU3: Der Rechenkern soll nicht nur uebersetzen, sondern rechnen. Der
      # Referenzlauf gehoert nicht in den Solution-Filter (er ist eine Exe, kein
      # Testprojekt) und wird deshalb einzeln gebaut.
      - name: Referenzlauf bauen
        run: dotnet build EPOS.Referenzlauf/EPOS.Referenzlauf.csproj -c Release

      # Die reduzierte Testdatenbank liegt nicht in jedem Checkout. Fehlt sie,
      # wird der Schritt uebersprungen statt rot - der Bauteil oben ist der
      # eigentliche Waechter, dieser Schritt der Zugewinn.
      # iU4-7: drei Projekte statt einem. 1030 ist die Kaskade; 1007 und 1017
      # fuehren aktive Stromspeicher-Varianten und decken damit den K8-Haken ab
      # (SimulationControl.Stromspeicher.cs samt ModuleInitializer), der mit iU4
      # in den Kern gezogen ist. Ohne sie wuerde ein stillgelegter Haken hier
      # nicht auffallen.
      # W6-O-7 (06.09.2026): 1045 kommt als VIERTES dazu - das Pruefprojekt
      # "Ost/West Straenge". Es ist das einzige Projekt der Basis mit Zeilen in
      # Z_AnlageStrang und deshalb der einzige Lauf, der den Strangweg der Stufe S3
      # (Clipping, Wirkungsgradkennlinie, Nachtverbrauch, Modul je Strang)
      # ueberhaupt betritt. Ohne es haette die CI fuer diesen Rechenweg nichts in
      # der Hand als den Pruefstand.
      # SP-O-8 (11.09.2026): 1046 kommt als FUENFTES dazu - das Pruefprojekt
      # "Speicherflotte". Es ist das einzige Projekt der Basis mit einem aktivierten
      # Stand @Projektflotte in Tab_SpeicherAuslegung und deshalb der einzige Lauf,
      # der den FLOTTENpfad des Projektlaufs betritt (SpeicherFlottenProjektCtrl,
      # SpeicherEngine/FlottenSimulator: Verteilung Kaskade, getrennte
      # Richtungswirkungsgrade, SoC-Grenzen, Peak-Reserve, getrennte Netzbilanz).
      # Die uebrigen fahren alle die Einzelanlage.
      # AK1 W5 (25.09.2026): 1047 kommt als SECHSTES dazu - das Referenzprojekt
      # "Anlagenkopplung AK1", eine Kopie von 1017 mit gekoppeltem Heizkreis
      # (Radiator, Heizkurve) und gekoppelter Kuehluebergabe (Kuehldecke). Es ist
      # das einzige Projekt der Basis mit Tab_Einstellungen.Anlagenkopplung = AK1
      # und deshalb der einzige Lauf, der Schritt H und Schritt K des VDI-Wegs
      # betritt (Vorlauf, Ruecklauf, begrenzte Stunden, Reihen vorlauf_/ruecklauf_/
      # uebergabe_ und ihre Kuehl-Gegenstuecke).
      # R22 (26.09.2026): 1049 kommt als SIEBTES dazu - das Referenzprojekt
      # "Solarthermie", eine Kopie von 1018 mit Kaskade Solarthermie -> BHKW ->
      # Heizkessel. Es ist das einzige Projekt der Basis, dessen Kollektorfeld
      # deckt (direkt und ueber den Puffer), und der einzige Lauf mit der
      # Nachrang-Vorgabe 30 % bei Solarthermie am Puffer.
      # R23 (26.09.2026): dieselben sieben Projekte; neu eingefroren, weil der
      # Heizkessel seinen Bereitschaftsverlust nur in betriebsbereiten Stunden
      # traegt und der Elektrokessel keine Kesselemission mehr fuehrt.
      # R24 (27.09.2026): dieselben sieben Projekte; neu eingefroren, weil ein
      # Heiztag der Kesselbereitschaft das Tagesmittel der Aussentemperatur
      # unter der Heizgrenze des Projekts ist (Vorgabe 15 Grad C).
      # R25 (29.09.2026): dieselben sieben Projekte; neu eingefroren auf Windows,
      # weil die Abschaltpruefung der Phase G den Zahlenrand traegt und ein Rest
      # im Quellspeicher einer Waermepumpe als leer gilt (Plattformbefund PB-1).
      # Auf ubuntu erwartet: PASS; byte-verschieden im Band heizstab.csv von
      # 1007 und 1046 (Reste von 1e-17 kWh, UCRT gegen glibc).
      # R26 (29.09.2026): dieselben sieben Projekte; neu eingefroren auf Linux,
      # weil ein Kessel erst ab dem Zahlenrand laeuft (Rechenrest keine
      # Laufstunde, nur 1024); gegen R25 byte-verschieden unter den sieben
      # allein heizstab.csv von 1007 und 1046 (Plattformwechsel).
      # R27 (30.09.2026): dieselben sieben Projekte; neu eingefroren auf Linux,
      # weil der Heizkessel je Stunde mit dem Wirkungsgrad seiner Laststufe
      # rechnet (Kesselkennlinie E2) und aggregate.csv je Kessel fuenf
      # Kennlinienschluessel fuehrt; unter den sieben aendern sich nur diese
      # Schluessel. Das Referenzprojekt 1050 steht in der Basis, nicht hier.
      # R28 (30.09.2026): dieselben sieben Projekte; neu eingefroren auf Linux,
      # weil Schemaschritt 158 die Brennstoffkessel der Projektkopien nach ihrem
      # Katalogsatz als Brennwertkessel kennzeichnet (Kesselkennlinie E2b, eta30
      # = eta100 + 0,06) und aggregate.csv je Kessel vier Brennwertschluessel
      # fuehrt (E3); unter den sieben aendern sich Brennstoff, Nutzungsgrad und
      # Kesselemissionen von 1007, 1030, 1045, 1046 und 1049, alle Zeitreihen
      # bleiben byte-gleich. Die Brennwertkennlinie rechnet allein 1050.
      # R29 (30.09.2026): dieselben sieben Projekte; neu eingefroren auf Linux,
      # weil jeder Brennstoffkessel unter seiner Mindestleistung taktet
      # (Kesselkennlinie E4: Starts je Taktstunde, Anfahrverlust je Start, leere
      # Felder mit den Normvorgaben) und aggregate.csv je Kessel sechs
      # Taktschluessel fuehrt; unter den sieben aendern sich Starts, Brennstoff,
      # Nutzungsgrad und Kesselemissionen von 1007, 1030, 1045, 1046 und 1049
      # (1045 und 1049 auch die Gasspitze), 1017 und 1047 (Elektrokessel) nur um
      # die neuen Schluessel; alle Zeitreihen bleiben byte-gleich.
      # R30 (30.09.2026): dieselben sieben Projekte; neu eingefroren auf Linux,
      # weil die Zuordnung Projekt-Stromverbraucher ueber die ID gilt (SV1): Die
      # gepflegte Jahressumme der Zuordnungszeile greift auch bei umbenannter
      # Projektkopie, Kopf- und Typsatz kommen nur aus dem eigenen Projekt. Unter
      # den sieben aendern sich allein 1017 und 1047 (Strombedarf 672 -> 15
      # MWh/a, Netzbezug, Reststrom, Stromspeicher; je fuenf Dateien), die
      # uebrigen fuenf bleiben byte-gleich.
      # R31 (02.10.2026): dieselben sieben Projekte; neu eingefroren auf Linux,
      # weil die untere Grenzleistung des BHKW aus dem Anlagenfeld wirkt (RB1:
      # Anlagenfeld vor Katalog vor Projekt, in allen drei Betriebsarten). Unter
      # den sieben aendert sich allein 1049 (Anlagenfeld 35 statt Projekt 30 %:
      # BHKW-Waerme 52,00 -> 49,09 MWh/a, Kessel 6,32 -> 9,23 MWh/a; fuenf
      # Dateien), die uebrigen sechs bleiben byte-gleich.
      # R32 (02.10.2026): dieselben sieben Projekte; neu eingefroren auf Linux,
      # weil das Kollektorfeld von 1049 seine Arbeitstemperatur aus der untersten
      # Zone des Puffers bildet (Welle M2 Solarthermie, ST2 mit ST4). Unter den
      # sieben aendert sich allein 1049 (genutzte Solarwaerme 10,73 -> 9,38 MWh/a,
      # Ueberschuss 27,13 -> 19,73 MWh/a; zwoelf Dateien), die uebrigen sechs
      # bleiben byte-gleich.
      # R33 (02.10.2026): dieselben sieben Projekte; neu eingefroren auf Linux,
      # weil die Photovoltaik je Viertelstunde bilanziert (Welle M5, SB1 a). Unter
      # den sieben aendern sich 1007, 1045 und 1046 (Direktverbrauch -0,05 bis
      # -0,1 %, Einspeisung und Restbezug entsprechend), die uebrigen vier bleiben
      # byte-gleich.
      # R34 (03.10.2026): dazu 1051 (Konditionierung); neu eingefroren auf Linux,
      # weil die Bauteile am Erdreich mit dem Erdreichwiderstand nach DIN EN ISO
      # 13370 rechnen. Die Gebaeude mit Erdreichbauteilen aendern ihre Heizwaerme,
      # 1030 (ohne Gebaeudemodell) bleibt byte-gleich.
      # R42 (07.10.2026): dazu 1058 (RP-AK3, Stufe AK3 mit Heizungspuffer);
      # die Waermepumpe interpoliert ihre Kennlinie ueber den Vorlauf (AK3-I).
      # Unter den acht aendert sich allein 1047 (WP-Strom -0,48 %), die
      # uebrigen sieben bleiben byte-gleich.
      # R43 (07.10.2026): dieselben neun Projekte; die Gebaeude heizen und
      # kuehlen eine Zone nie am selben Tag (Zonensperre), auf AK3 steht die
      # Kaelteseite im Kreis (AK3-K). Unter den neun aendern sich 1017, 1047
      # und 1058, die uebrigen sechs bleiben byte-gleich; RP-AK3K 1059 steht
      # nicht in der CI-Auswahl.
      # R44 (08.10.2026): dieselben neun Projekte, alle byte-gleich; neu sind
      # RP-KK 1061 (Kuehlkurve) und RP-KKZ 1062 (Kuehlkurve, zwei Zonen),
      # beide nicht in der CI-Auswahl.
      # R45 (09.10.2026): dazu 1060 (Uebergabegrenze: Heizkoerper 75/60 Grad C,
      # Hoechstvorlauf 55 Grad C, Einbindung direkt, Vorwaermbetrieb); die neun
      # Projekte bleiben byte-gleich.
      # R46 (09.10.2026): dieselben zehn Projekte; allein 1060 aendert sich
      # (Geraetegrenzen: Ruecklaufgrenze am gemischten Ruecklauf), die neun
      # uebrigen bleiben byte-gleich.
      # R47 (09.10.2026): dieselben zehn Projekte; allein 1045 aendert sich
      # (Feiertage zaehlen im Zapfkalender als Sonntag), die neun uebrigen
      # bleiben byte-gleich.
      - name: Kern-Referenzlauf 1030, 1007, 1017, 1045, 1046, 1047, 1049, 1051, 1058, 1060
        if: hashFiles('Referenzlaeufe/Kenndaten_Test.sqlite') != ''
        run: >
          dotnet run --project EPOS.Referenzlauf -c Release --no-build --
          lauf --quelle Referenzlaeufe/Kenndaten_Test.sqlite
          --projekte 1030,1007,1017,1045,1046,1047,1049,1051,1058,1060 --ziel artifacts/reflauf/${{ matrix.os }}_kern

      # Der eigentliche Nachweis (Umsetzungskonzept iT3, Entscheidungsregister 2.3):
      # Vergleich gegen die eingefrorene Windows-Basis nach der Toleranzregel der
      # Suite (Betrag >= 1: rel. 1e-4, sonst abs. 0,01). Exit 1 bei FAIL macht den
      # Job rot. Der Byte-Diff danach ist nur Information - auf ARM64 sind
      # Gleitkomma-Abweichungen im Rahmen der Toleranz erwartbar (iF15).
      - name: Vergleich mit Referenzbasis 2026-10-09_R48_Gemeinjahr
        if: hashFiles('Referenzlaeufe/Kenndaten_Test.sqlite') != ''
        run: |
          mkdir -p artifacts/reflauf/ref
          cp -r Referenzlaeufe/2026-10-09_R48_Gemeinjahr/Projekt_1030 artifacts/reflauf/ref/
          cp -r Referenzlaeufe/2026-10-09_R48_Gemeinjahr/Projekt_1007 artifacts/reflauf/ref/
          cp -r Referenzlaeufe/2026-10-09_R48_Gemeinjahr/Projekt_1017 artifacts/reflauf/ref/
          cp -r Referenzlaeufe/2026-10-09_R48_Gemeinjahr/Projekt_1045 artifacts/reflauf/ref/
          cp -r Referenzlaeufe/2026-10-09_R48_Gemeinjahr/Projekt_1046 artifacts/reflauf/ref/
          cp -r Referenzlaeufe/2026-10-09_R48_Gemeinjahr/Projekt_1047 artifacts/reflauf/ref/
          cp -r Referenzlaeufe/2026-10-09_R48_Gemeinjahr/Projekt_1049 artifacts/reflauf/ref/
          cp -r Referenzlaeufe/2026-10-09_R48_Gemeinjahr/Projekt_1051 artifacts/reflauf/ref/
          cp -r Referenzlaeufe/2026-10-09_R48_Gemeinjahr/Projekt_1058 artifacts/reflauf/ref/
          cp -r Referenzlaeufe/2026-10-09_R48_Gemeinjahr/Projekt_1060 artifacts/reflauf/ref/
          dotnet run --project EPOS.Referenzlauf -c Release --no-build -- vergleich artifacts/reflauf/ref artifacts/reflauf/${{ matrix.os }}_kern
          echo "--- Byte-Diff (nur Information) ---"
          for p in 1030 1007 1017 1045 1046 1047 1049 1051 1058 1060; do
            if diff -rq artifacts/reflauf/ref/Projekt_$p artifacts/reflauf/${{ matrix.os }}_kern/Projekt_$p; then echo "BYTE-GLEICH: Projekt_$p"; else echo "byte-verschieden: Projekt_$p (siehe oben) - Toleranzvergleich oben ist massgeblich"; fi
          done

      # Plattformnachweis (Befund PB-1, Basis R34): dieselben Projekte noch
      # einmal mit --stoerung ulp. Exp, Sin, Cos, Asin und Acos der Naht
      # Plattformrundung (Gebaeudematrix, Sonnenstand, Erdreich, Kollektor,
      # Tagesbilanz) runden dann wie eine andere C-Bibliothek: etwa jedes
      # sechzehnte Ergebnis um +-1 ulp verschoben. Keine Betriebsentscheidung darf
      # daran kippen - gestoert gegen ungestoert muss GESAMT PASS sein, Exit 1 bei
      # FAIL macht den Job rot. Der gestoerte Lauf wird nie eingefroren.
      - name: Plattformnachweis - gestoerter Lauf gegen ungestoerten
        if: hashFiles('Referenzlaeufe/Kenndaten_Test.sqlite') != ''
        run: |
          dotnet run --project EPOS.Referenzlauf -c Release --no-build -- lauf --quelle Referenzlaeufe/Kenndaten_Test.sqlite --projekte 1030,1007,1017,1045,1046,1047,1049,1051,1058,1060 --ziel artifacts/reflauf/${{ matrix.os }}_stoerung --stoerung ulp
          dotnet run --project EPOS.Referenzlauf -c Release --no-build -- vergleich artifacts/reflauf/${{ matrix.os }}_kern artifacts/reflauf/${{ matrix.os }}_stoerung

      - name: Ergebnis-CSV als Artefakt
        if: always() && hashFiles('Referenzlaeufe/Kenndaten_Test.sqlite') != ''
        uses: actions/upload-artifact@v4
        with:
          name: reflauf-kern-${{ matrix.os }}
          path: artifacts/reflauf/${{ matrix.os }}_kern
          retention-days: 14
