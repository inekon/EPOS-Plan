  <text x="385" y="320" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="600">Puffer Heizung 1 000 l</text>
  <path d="M190,360 L323.5,360" fill="none" stroke="#c56a1a" stroke-width="3" stroke-linejoin="round" marker-end="url(#pfeil-1)"/>
