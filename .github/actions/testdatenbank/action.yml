# Holt die Testdatenbank Referenzlaeufe/Kenndaten_Test.sqlite aus Git LFS - gezielt nur diese
# eine Datei, nicht die Herstellerarchive - und prueft, dass kein LFS-Zeiger liegen geblieben ist.
# Jeder Job des Kern-Laufs, der die Datenbank liest, ruft diesen Schritt nach actions/checkout auf
# (Checkout OHNE "lfs: true": das zoege alle LFS-Dateien und ginge voll auf das Bandbreitenkontingent).
name: Testdatenbank aus LFS
description: Testdatenbank aus dem LFS-Zwischenlager oder gezielt aus LFS holen und pruefen
runs:
  using: composite
  steps:
    # Das Zwischenlager haengt am Hash des ZEIGERS - der aendert sich genau dann, wenn sich die
    # Testdatenbank aendert. Ein Treffer spart den Download vollstaendig; alle Jobs teilen ihn.
    - name: LFS-Zwischenlager
      uses: actions/cache@v4
      with:
        path: .git/lfs
        key: lfs-testdb-${{ hashFiles('Referenzlaeufe/Kenndaten_Test.sqlite') }}

    # Danach die Probe aufs Exempel - ohne sie schluege ein liegengebliebener Zeiger erst weit
    # unten als "file is not a database" auf. Die Laeufer (ubuntu, macos) bringen git-lfs mit.
    - name: Testdatenbank aus LFS
      shell: bash
      run: |
        git lfs pull --include="Referenzlaeufe/Kenndaten_Test.sqlite" --exclude=""
        datei=Referenzlaeufe/Kenndaten_Test.sqlite
        groesse=$(wc -c < "$datei" | tr -d ' ')
        kopf=$(head -c 40 "$datei")
        case "$kopf" in
          "version https://git-lfs"*)
            echo "FEHLER: $datei ist ein Git-LFS-Zeiger ($groesse Byte) statt der Datenbank."
            echo "Abhilfe: einmal je Rechner 'git lfs install', danach"
            echo "         git lfs pull --include=Referenzlaeufe/Kenndaten_Test.sqlite"
            exit 1
            ;;
        esac
        if [ "$groesse" -lt 1000000 ]; then
          echo "FEHLER: $datei ist mit $groesse Byte zu klein - der LFS-Abruf ist nicht durchgekommen."
          exit 1
        fi
        echo "Testdatenbank aus LFS: $groesse Byte"
