<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: Die Seite reicht unter die abgerundeten Ecken und
         die Home-Anzeige des iPads; die sicheren Abstaende setzt das Thema. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <base href="/" />

    <!--
        Startseite der iOS-Huelle (Umsetzungskonzept iOS, Paket iU10).

        Zeichengleich zu WindowsFormsApplication1/wwwroot/index.html bis auf
        zwei Stellen:

          * EPOS.iOS.styles.css statt EPOS_Plan.styles.css - der Dateiname des
            gebuendelten Komponenten-CSS folgt dem HOST-Assembly, und das heisst
            hier EPOS.iOS.
          * viewport-fit=cover oben.

        Die Seite wird nicht im Browser aufgerufen: Die BlazorWebView laedt sie
        ueber HostPage="wwwroot/index.html" und haengt EPOS.UI.Seiten.AppWurzel
        an <div id="app">.
    -->
    <link href="_content/EPOS.UI/epos-ui.css" rel="stylesheet" />
    <link href="EPOS.iOS.styles.css" rel="stylesheet" />
</head>
<body>
    <div id="app"></div>
    <script src="_framework/blazor.webview.js"></script>
</body>
</html>
