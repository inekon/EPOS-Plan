<!--
Hydraulische Einbindung des Brauchwassers (Prinzipbild)

Inhalt: Ein Heizkessel (Vorlauf 70 °C) und eine Wärmepumpe (Vorlauf 55 °C) laden einen
geschichteten Kombispeicher mit 1 000 l und der Nutzung Heizung und Brauchwasser. Der Kessel
speist oben in den Bereitschaftsteil ein, die Wärmepumpe in die Heizungszone; das legt die
Einspeisehöhe der Senke fest. Ein Frischwassermodul zapft aus der obersten Zone und erwärmt das
Kaltwasser (10 °C) auf die Zapftemperatur 60 °C; es braucht oben die Zapftemperatur plus die
Grädigkeit von 5 K. Die Zirkulation führt von den Zapfstellen zurück zum Modul und ist in
EPOS-Plan eine eigene Teilreihe des Brauchwasserkanals. Der Heizkreis entnimmt aus der Mitte.

Annahmen: Zonenanteile von oben 0,10 / 0,16 / 0,37 / 0,37 (Vorschlag Kombispeicher). Pumpen,
Mischer und Sicherheitstechnik sind weggelassen.

Darstellung: Vorlauf durchgezogen, Rücklauf gestrichelt, Kaltwasser türkis, Pfeile in
Fließrichtung, Ziffern in Kreisen verweisen auf die Erläuterung unten. Farben nach
Vorlage:Diagrammfarbe (waerme, kessel, speicher, kaelte, netz). Prinzipbild mit gerundeten
Beispielwerten, keinem Produkt zugeordnet.
-->
