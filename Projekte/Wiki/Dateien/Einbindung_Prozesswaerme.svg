  <text x="115.0" y="178.5" font-size="13" fill="#57606a" text-anchor="middle">Rang 1: Puffer Prozess</text>
  <text x="115.0" y="195.5" font-size="13" fill="#57606a" text-anchor="middle">Rang 2: Heizkreis</text>
