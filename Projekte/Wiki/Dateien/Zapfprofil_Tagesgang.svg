<!--
Tagesgang eines Zapfprofils (Prinzipbild)

Inhalt: Anteil jeder Stunde am Tagesbedarf an Warmwasser für eine Wohnzone, Werktag und
Sonntag nebeneinander. Werktags liegen die Spitzen am Morgen (6 bis 8 Uhr) und am Abend
(18 bis 20 Uhr), sonntags beginnt der Tag später. Feiertage tragen den Sonntagsgang, der
Samstag seinen eigenen Gang. Unten die Zuordnung der Wochentage.

Annahmen: Prinzipwerte, je Tag auf 100 % normiert; keine Katalog- oder Normwerte und kein
Ergebnis von EPOS-Plan. Farben nach Vorlage:Diagrammfarbe (waerme, speicher).
-->
