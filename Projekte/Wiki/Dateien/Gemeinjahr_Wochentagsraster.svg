<!--
Gemeinjahr und Wochentagsraster (Prinzipbild)

Inhalt: Oben die Tage 91 bis 105 des Gemeinjahrs (1. bis 15. April) im Wochentagsraster
eines Beispielprojekts, dessen Klimaregion den Jahrestag 1 auf einen Donnerstag legt. Der
Anker der Osterregel ist der Jahrestag 98 (8. April, hier ein Mittwoch); der nächste Sonntag
ist der Jahrestag 95 (3 Tage davor) gegenüber Jahrestag 102 (4 Tage danach), also ist der
Jahrestag 95 Ostersonntag. Unten das ganze Jahr mit 365 Tagen, den festen Feiertagen und den
beweglichen Feiertagen im festen Abstand zu Ostern sowie dem Buß- und Bettag als letztem
Mittwoch vor dem Jahrestag 327.

Darstellung: Farben nach Vorlage:Diagrammfarbe (speicher für Feiertage, solar für den
Anker, netz für Wochenenden). Prinzipbild, kein Ergebnis von EPOS-Plan.
-->
