<!--
Wochenprofil der Prozesswärme mit Betriebskalender (Prinzipbild)

Inhalt: Drei Wochenprofile aus 168 Stundenwerten als relative Last. Oben die Betriebsweise
„Einschicht 5 Tage“ des ausgelieferten Katalogs (Montag bis Freitag 6 bis 14 Uhr volle Last, die
Stunde davor halbe Last), in der Mitte „Zweischicht 5 Tage“ (Montag bis Freitag 6 bis 22 Uhr),
unten dieselbe Zweischichtwoche mit einem Feiertag am Mittwoch: Ein Betriebskalender mit
„Feiertag wie Sonntag“ gibt dem Tag die 24 Werte des Sonntags.

Annahmen: Gezeigt ist die relative Last vor der Monatsnormierung. Die Energiemenge bestimmen die
Monatswerte; der Feiertag verschiebt sie auf die übrigen Arbeitstage des Monats.

Darstellung: Farbe nach Vorlage:Diagrammfarbe (waerme). Prinzipbild.
-->
