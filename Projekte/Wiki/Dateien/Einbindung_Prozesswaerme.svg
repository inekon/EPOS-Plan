  <rect x="640" y="350" width="200" height="70" rx="8" fill="#fcfcfb" stroke="#c56a1a" stroke-width="2"/>
  <text x="740.0" y="381.5" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="600">Heizkreis</text>
  <text x="740.0" y="398.5" font-size="13" fill="#57606a" text-anchor="middle">45/35 °C</text>
  <path d="M440,370 L633.5,370" fill="none" stroke="#c56a1a" stroke-width="3" stroke-linejoin="round" marker-end="url(#pfeil-1)"/>
  <path d="M640,405 L446.5,405" fill="none" stroke="#c56a1a" stroke-width="3" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#pfeil-1)"/>
  <path d="M190,335 L230,300 L560,300 L620,214" fill="none" stroke="#7a828c" stroke-width="2" stroke-dasharray="2 5"/>
