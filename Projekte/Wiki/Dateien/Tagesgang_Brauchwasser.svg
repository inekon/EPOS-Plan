<!--
Tagesgang des Brauchwasserbedarfs: Bestandsprofil gegen Zapfprofil (Prinzipbild)

Inhalt: Derselbe Tagesbedarf eines Wohngebäudes, oben als Stundenmittel eines Wochenprofils
(Bestandsprofil), unten als eine Realisierung des Zapfprofilgenerators mit einzelnen
Zapfereignissen. Säulen in Prozent des Tagesbedarfs; beide Tage summieren sich zu 100 %.

Annahmen: Ausgedachte, gerundete Beispielwerte; die Realisierung ist keine Ausgabe von EPOS-Plan,
sondern zeigt nur, dass die Zapfung in einzelnen Stunden gebündelt anfällt, während das
Bestandsprofil sie glättet. Skala beider Felder gleich, 15 % = volle Höhe.

Darstellung: Farben nach Vorlage:Diagrammfarbe (waerme, kaelte für das Zapfprofil).
-->
